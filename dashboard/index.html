<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北美渠道总看板</title>
<style>
/* ===== Design tokens ===== */
:root{
  --bg:#F5F6F8;
  --panel:#FFFFFF;
  --panel-2:#FAFBFC;
  --line:#E3E7ED;
  --line-2:#EDF0F4;
  --ink:#0F1729;
  --ink-2:#475467;
  --ink-3:#8A94A6;
  --brand:#1D4ED8;
  --brand-2:#3B82F6;
  --brand-soft:#EDF2FF;
  --ok:#067647;
  --ok-soft:#E7F6EE;
  --warn:#B54708;
  --warn-soft:#FEF4E6;
  --danger:#B42318;
  --danger-soft:#FDECEA;
  --violet:#6941C6;
  --violet-soft:#F2EDFD;
  --teal:#0E7490;
  --teal-soft:#E7F6F9;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12), 0 2px 8px rgba(16,24,40,.06);
  --r:12px;
  --r-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}

/* ===== Top bar ===== */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1560px;margin:0 auto;padding:14px 24px 0;
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
}
.brandmark{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,#1D4ED8,#0E7490);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;
  box-shadow:0 2px 6px rgba(29,78,216,.28);
}
.titles h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.titles .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:4px 9px;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);border:1px solid #F7D9AE;font-weight:600;
}
.pill.gray{background:#F2F4F7;color:var(--ink-2);border-color:var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* ===== Tabs ===== */
.tabs{
  max-width:1560px;margin:0 auto;padding:0 24px;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;
  padding:10px 12px 12px;font-size:12.5px;font-weight:560;color:var(--ink-2);
  border-bottom:2px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab .n{
  font-size:10px;background:#F2F4F7;color:var(--ink-3);border-radius:5px;padding:1px 5px;font-weight:600;
}
.tab.active .n{background:var(--brand-soft);color:var(--brand)}

/* ===== Layout ===== */
main{max-width:1560px;margin:0 auto;padding:18px 24px 64px}
.view{display:none}
.view.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ===== Filter bar ===== */
.filterbar{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 14px;margin-bottom:16px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.filterbar .lbl{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
select,input[type=text],input[type=date],input[type=number]{
  font-family:inherit;font-size:12px;color:var(--ink);
  border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:6px 9px;outline:none;transition:.15s;
}
select:focus,input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.search{position:relative;min-width:220px;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding-left:29px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.45}
.filterbar .sep{width:1px;height:20px;background:var(--line)}
.btn{
  appearance:none;cursor:pointer;border:1px solid var(--line);background:#fff;
  border-radius:7px;padding:6px 11px;font-size:12px;font-weight:560;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:5px;transition:.15s;
}
.btn:hover{background:#F9FAFB;color:var(--ink);border-color:#D5DAE1}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1B45C4;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:11px}

/* ===== Cards ===== */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.card-h{
  display:flex;align-items:center;gap:8px;
  padding:13px 16px 0;
}
.card-h h3{margin:0;font-size:13px;font-weight:650;letter-spacing:-.01em}
.card-h .hint{font-size:11px;color:var(--ink-3);font-weight:400}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
@media (max-width:1180px){.g-3,.g-4{grid-template-columns:1fr 1fr}.g-2{grid-template-columns:1fr}}
@media (max-width:760px){.g-3,.g-4,.g-2{grid-template-columns:1fr}}

/* ===== KPI ===== */
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi .k{font-size:11px;color:var(--ink-2);font-weight:560;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:23px;font-weight:680;letter-spacing:-.02em;margin-top:3px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:600;color:var(--ink-3);margin-left:3px}
.kpi .d{font-size:10.5px;color:var(--ink-3);margin-top:3px;min-height:14px}
.kpi.accent{background:linear-gradient(180deg,#FBFCFE,#fff);border-color:#DCE3F0}
.kpi .bar{height:3px;border-radius:2px;background:var(--line-2);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:2px;background:var(--brand-2)}
.kpi.alert{border-color:#F3C9C3;background:linear-gradient(180deg,#FFFBFB,#fff)}
.kpi.alert .v{color:var(--danger)}

/* ===== legend / chips ===== */
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:5px;white-space:nowrap;line-height:1.5;
}
.chip.high{background:var(--danger-soft);color:var(--danger)}
.chip.mid{background:var(--warn-soft);color:var(--warn)}
.chip.low{background:#F2F4F7;color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.na{background:#F4F5F7;color:var(--ink-3);border:1px dashed #D9DEE6}
.chip.blue{background:var(--brand-soft);color:var(--brand)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.plain{background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:500}
/* 新增名单：琥珀色，和 P 码的红/橙/灰、角色的蓝/青都区分得开 */
.chip.lead{background:#FFFAEB;color:#B54708;border:1px solid #FEDF89;font-weight:600}

/* 跟进页的「全部 / 新增名单 / 原表客户」范围切换 */
.scope{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;vertical-align:middle}
.scope button{
  border:0;border-right:1px solid var(--line);background:transparent;font:inherit;
  font-size:11px;padding:4px 9px;color:var(--ink-2);cursor:pointer;line-height:1.5;
}
.scope button:last-child{border-right:0}
.scope button:hover{background:#F8FAFF;color:var(--brand)}
.scope button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.scope button .n{margin-left:4px;font-size:10px;font-variant-numeric:tabular-nums;opacity:.75}

/* ===== table ===== */
.tablewrap{overflow:auto;max-height:calc(100vh - 240px)}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.dt thead th{
  position:sticky;top:0;z-index:2;background:#FCFCFD;
  text-align:left;font-weight:600;color:var(--ink-2);font-size:11px;
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  user-select:none;
}
table.dt thead th.sortable{cursor:pointer}
table.dt thead th.sortable:hover{color:var(--brand)}
table.dt thead th .sort{opacity:.3;font-size:9px;margin-left:2px}
table.dt thead th.on .sort{opacity:1;color:var(--brand)}
table.dt tbody td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.dt tbody tr{cursor:pointer;transition:background .12s}
table.dt tbody tr:hover{background:#F8FAFF}
table.dt tbody tr.sel{background:var(--brand-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.tname{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.tname .flag{font-size:9.5px;padding:1px 4px;border-radius:3px;background:#F2F4F7;color:var(--ink-3);font-weight:600}
.mini{font-size:10.5px;color:var(--ink-3)}

/* progress / minibars */
.mbar{height:5px;border-radius:3px;background:#EFF2F6;overflow:hidden;min-width:52px}
.mbar i{display:block;height:100%;border-radius:3px}
.cbar{display:flex;align-items:center;gap:6px}
.cbar .val{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}

/* ===== charts ===== */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:inherit}
.axis-lbl{font-size:10px;fill:var(--ink-3)}
.bar-lbl{font-size:11px;fill:var(--ink-2)}
.bar-val{font-size:11px;fill:var(--ink);font-weight:650}
.tick{stroke:#EEF1F5;stroke-width:1}
.gridline{stroke:#EEF1F5;stroke-width:1}
.quad{stroke:#DFE4EC;stroke-width:1;stroke-dasharray:4 4}
.hoverable{cursor:pointer}
.hoverable:hover{opacity:.82}

/* ===== drawer ===== */
.scrim{
  position:fixed;inset:0;background:rgba(15,23,41,.32);z-index:90;
  opacity:0;pointer-events:none;transition:.2s;
}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);z-index:100;
  background:#fff;box-shadow:var(--shadow-lg);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer-h{padding:16px 18px 13px;border-bottom:1px solid var(--line);flex:0 0 auto}
.drawer-h .top{display:flex;align-items:flex-start;gap:10px}
.drawer-h h2{margin:0;font-size:16px;font-weight:680;letter-spacing:-.01em}
.drawer-h .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.drawer-b{overflow:auto;padding:16px 18px 28px;flex:1 1 auto}
.xbtn{
  margin-left:auto;border:0;background:#F4F5F7;border-radius:7px;width:28px;height:28px;
  cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1;display:grid;place-items:center;flex:0 0 auto;
}
.xbtn:hover{background:#EAECF0}
.sect{margin-bottom:18px}
.sect > h4{
  margin:0 0 8px;font-size:11px;font-weight:700;color:var(--ink-3);
  letter-spacing:.06em;text-transform:uppercase;
}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;font-size:12px}
.kv dt{color:var(--ink-3);font-size:11.5px}
.kv dd{margin:0;color:var(--ink);word-break:break-word;white-space:pre-wrap}
.kv dd a{color:var(--brand);text-decoration:none;border-bottom:1px dashed rgba(29,78,216,.45)}
.kv dd a:hover{border-bottom-style:solid}

/* ===== 官网链接 ===== */
/* 抽屉头部的主按钮：整块可点，左边「打开官网」右边域名 */
.sitelink{
  display:inline-flex;align-items:center;gap:7px;margin-top:9px;max-width:100%;
  padding:5px 11px;border:1px solid #C7D7FE;border-radius:7px;background:#F6F9FF;
  font-size:11.5px;font-weight:600;color:var(--brand);text-decoration:none;
  line-height:1.5;transition:background .12s,border-color .12s;
}
.sitelink:hover{background:var(--brand-soft);border-color:#93B4FB}
.sitelink .u{font-weight:500;font-size:10.5px;color:var(--ink-3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitelink .arw{font-size:10.5px;line-height:1}
.sitelink.na{background:#F7F8FA;border:1px dashed #D9DEE6;color:var(--ink-3);font-weight:500;cursor:default}
/* 表格客户名后面的小箭头：默认淡，行 hover 时点亮 */
.tname .sitego{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:15px;height:15px;border-radius:4px;background:var(--brand-soft);color:var(--brand);
  font-size:9.5px;font-weight:700;line-height:1;text-decoration:none;opacity:.55;
  transition:opacity .12s,background .12s;
}
.tname .sitego:hover{opacity:1;background:#DBE6FF}
tr:hover .tname .sitego{opacity:.9}
.rawbox{
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;
  padding:10px 12px;font-size:11.5px;color:var(--ink-2);white-space:pre-wrap;
  max-height:190px;overflow:auto;line-height:1.55;
}
.dimrow{
  display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px dashed var(--line-2);
}
.dimrow:last-child{border-bottom:0}
.dimrow .dn{font-size:12px;font-weight:560}
.dimrow .ev{font-size:10.8px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.dimrow .sc{text-align:right;font-size:13px;font-weight:680;font-variant-numeric:tabular-nums}
.dimrow .sc.na{font-size:10.5px;font-weight:600;color:var(--ink-3)}

/* ===== misc ===== */
.note{
  font-size:11.5px;color:var(--ink-2);background:var(--panel-2);
  border:1px solid var(--line-2);border-left:3px solid var(--brand-2);
  border-radius:6px;padding:9px 11px;line-height:1.6;
}
.note.warn{border-left-color:#F79009;background:#FFFCF5}
.note b{font-weight:650}
.empty{
  padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12px;
  border:1px dashed #DDE2E9;border-radius:9px;background:var(--panel-2);
}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar .sp{flex:1}
.slidewrap{display:flex;align-items:center;gap:8px}
.slidewrap input[type=range]{width:96px;accent-color:var(--brand)}
.slidewrap .wv{font-size:11.5px;font-weight:680;min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
.wrow{
  display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;
  padding:8px 0;border-bottom:1px dashed var(--line-2);
}
.wrow:last-child{border-bottom:0}
.wrow .wn{font-size:12px;font-weight:560}
.wrow .wd{font-size:10.5px;color:var(--ink-3);margin-top:1px}
input[type=text].cellin{
  width:100%;border:1px solid transparent;background:transparent;border-radius:5px;
  padding:3px 5px;font-size:11.5px;color:var(--ink);
}
input[type=text].cellin:hover{border-color:var(--line);background:#fff}
input[type=text].cellin:focus{border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 2px rgba(59,130,246,.12)}
select.cellin{border:1px solid transparent;background:transparent;font-size:11.5px;padding:3px 4px}
select.cellin:hover{border-color:var(--line);background:#fff}
.bucket{margin-bottom:14px}
.bucket-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bucket-h h4{margin:0;font-size:12.5px;font-weight:650}
.bucket-h .cnt{font-size:11px;color:var(--ink-3)}
.rulelist{font-size:11.5px;color:var(--ink-2);line-height:1.75;padding-left:16px;margin:6px 0}
.rulelist li{margin-bottom:3px}
.rulelist code{
  background:#F4F5F7;border-radius:4px;padding:1px 5px;font-size:10.8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--violet);
}
.ftable{width:100%;border-collapse:collapse;font-size:11.5px}
.ftable th,.ftable td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.ftable th{background:#FCFCFD;font-weight:600;color:var(--ink-2);font-size:11px}
.ftable code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--violet)}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);
  background:#101828;color:#fff;font-size:12px;padding:9px 15px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.22s;z-index:200;box-shadow:var(--shadow-lg);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrollx{overflow-x:auto}
.dt.fixed{table-layout:fixed;min-width:1290px}
.dt.fixed td,.dt.fixed th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:230px}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:240px}
.grid.top{align-items:start}
.ftable{table-layout:fixed}
.ftable col.c1{width:250px}
.ftable col.c2{width:210px}
.ftable td code{white-space:normal;word-break:break-word;display:inline-block;max-width:100%}
.halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.ell{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt.fixed td.rel{white-space:normal;line-height:1.9}
.dt.fixed td.rel .chip{margin:1px 0}
.sub-h{font-size:12px;font-weight:650;color:var(--ink)}
.ftable.rules td{line-height:1.85}
.ftable.rules tr.hl td{background:#F8FAFF;font-weight:600}
.ftable.rules code{white-space:nowrap;display:inline}

/* ===== 总部地图 ===== */
.map-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1180px){.map-grid{grid-template-columns:1fr}}
.map-card{overflow:hidden}
.map-svg{display:block;width:100%;height:auto;background:linear-gradient(180deg,#FBFCFE 0%,#F7F9FC 100%)}
.map-svg .land{stroke:#FFFFFF;stroke-width:.85;stroke-linejoin:round}
.map-svg .coast{fill:none;stroke:#AEB9C9;stroke-width:1.05;stroke-linejoin:round;pointer-events:none}
.map-svg .cname{font-size:10px;font-weight:700;letter-spacing:.22em;fill:#B6BFCD;pointer-events:none}
.map-svg .mdot{cursor:pointer;transition:r .12s}
.map-svg .mdot:hover{stroke:#0F1729;stroke-width:1.6}
.map-svg .mlabel{font-size:8.6px;font-weight:600;fill:#334155;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:2.4px;stroke-linejoin:round}
.map-svg .mlabel.hi{fill:#0F1729;font-weight:700}
.map-svg .mleader{stroke:#94A3B8;stroke-width:.7;stroke-dasharray:1.6 1.6}

.maptip{
  position:fixed;z-index:300;max-width:290px;background:#101828;color:#fff;border-radius:8px;
  padding:9px 11px;font-size:11.5px;line-height:1.55;box-shadow:0 10px 28px rgba(16,24,40,.28);
  opacity:0;pointer-events:none;transform:translateY(3px);transition:opacity .12s
}
.maptip.on{opacity:1;transform:translateY(0)}
.maptip.pin{pointer-events:auto}
.maptip .tt-h{font-weight:650;font-size:12px;margin-bottom:3px}
.maptip .tt-sub{color:#C7D0DD;font-size:10.5px;margin-bottom:6px}
.maptip .tt-row{display:flex;align-items:center;gap:6px;padding:2.5px 0;border-top:1px solid rgba(255,255,255,.1);cursor:pointer}
.maptip .tt-row:hover{color:#93C5FD}
.maptip .tt-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maptip .tt-row .sc{font-variant-numeric:tabular-nums;color:#C7D0DD;font-size:10.5px}
.maptip .tt-hint{color:#8FA0B8;font-size:10px;margin-top:5px}

.map-legend{display:flex;flex-wrap:wrap;gap:14px;padding:9px 12px;border-top:1px solid var(--line-2);background:#FCFCFD}
.map-legend .lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-3)}
.map-legend .sw{width:14px;height:9px;border-radius:2px;border:1px solid rgba(15,23,41,.08)}
.map-legend .dt2{width:8px;height:8px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(15,23,41,.18)}

.map-side .card+.card{margin-top:12px}
.dens-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.dens-row:last-child{border-bottom:0}
.dens-row .nm{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.dens-row .bar{flex:1;height:9px;border-radius:3px;background:#F1F3F6;display:flex;overflow:hidden}
.dens-row .bar i{display:block;height:100%}
.dens-row .n{width:22px;text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.missing-list{display:flex;flex-wrap:wrap;gap:4px}

/* ===== Type switcher（总看板顶部客户类型切换） ===== */
.typesw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);flex:0 0 auto}
.typesw button{border:0;background:transparent;padding:5px 12px;font-size:11.5px;color:var(--ink-2);cursor:pointer;font-weight:550;line-height:1.4}
.typesw button + button{border-left:1px solid var(--line)}
.typesw button:hover{background:#F9FAFB;color:var(--ink)}
.typesw button.on{background:var(--brand);color:#fff}
.typesw button.on + button{border-left-color:transparent}

/* ===== 开发与跟进（可编辑记录表） ===== */
table.dt.pipe td{padding:6px 7px;vertical-align:middle}
.pin{
  width:100%;min-width:70px;padding:4px 6px;font-size:11.5px;color:var(--ink);
  border:1px solid transparent;border-radius:6px;background:transparent;
  font-family:inherit;transition:border-color .12s,background .12s;
}
.pin:hover{border-color:#DDE3EC;background:#FBFCFD}
.pin:focus{outline:none;border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.pin::placeholder{color:#B4BDCB}
select.pin{cursor:pointer}
tr.late td{background:#FFFBF4}
tr.late:hover td{background:#FFF7EA}
table.dt.pipe{min-width:1320px}
table.dt.pipe th,table.dt.pipe td{white-space:nowrap}
table.dt.pipe td:nth-child(5),table.dt.pipe td:nth-child(9),table.dt.pipe td:nth-child(10){min-width:150px}
table.dt.pipe td:nth-child(4){min-width:126px}
table.dt.pipe td:nth-child(4) select{padding-right:2px}

</style>

<script>/* ============================================================
   core.js — 通用工具：文本/金额/SKU 解析、格式化、SVG 图表
   零售商看板与代理集成商看板共用此文件
   ============================================================ */
(function (global) {
  'use strict';

  const C = {
    brand: '#1D4ED8', brand2: '#3B82F6', brand3: '#93B4FB', soft: '#EDF2FF',
    high: '#B42318', mid: '#B54708', low: '#667085',
    ok: '#067647', violet: '#6941C6', teal: '#0E7490', pink: '#C11574',
    gray: '#98A2B3', line: '#E3E7ED',
    p1: '#B42318', p2: '#B54708', p3: '#667085',
  };

  const P_STYLE = {
    P1: { cls: 'high', color: C.p1, label: 'P1' },
    P2: { cls: 'mid', color: C.p2, label: 'P2' },
    P3: { cls: 'low', color: C.p3, label: 'P3' },
  };

  /* ---------- 基础 ---------- */
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const txt = (v) => {
    if (v == null) return '';
    const s = String(v).replace(/\u00a0/g, ' ').trim();
    return s === '' ? '' : s;
  };

  const num = (v) => {
    if (v == null || v === '') return null;
    const n = Number(String(v).replace(/[^\d.\-]/g, ''));
    return isFinite(n) ? n : null;
  };

  const pctf = (a, b) => (b ? Math.round((a / b) * 1000) / 10 : 0);

  /* 国家显示：新增名单里有 PR（波多黎各）和空值，不能再按「非美即加」二选一，
     否则波多黎各会被显示成加拿大。认不出就原样显示代码，空的写「未标注」。 */
  const COUNTRY_CN = { US: '美国', CA: '加拿大', PR: '波多黎各', MX: '墨西哥' };
  /* 国家代码归一：表里出现过「无标注」这种文字，若直接 slice(0,2) 会变成「无标」，
     所以只认标准两位字母代码，其余一律当作「未填」（页面显示「未标注」）。 */
  const iso2 = (v) => {
    const s = String(v == null ? '' : v).trim().toUpperCase();
    const m = s.match(/^([A-Z]{2})(?:$|[^A-Z])/);
    return m ? m[1] : '';
  };
  const countryLabel = (c) => {
    const k = String((c && c.country) || '').toUpperCase();
    if (!k) return '未标注';
    return COUNTRY_CN[k] || k;
  };

  /* ---------- 官网链接 ----------
     原表 125 家全部是完整的 https:// 开头，但仍做三层兜底：
     ① 去掉误粘的空白；② 缺协议时补 https://；③ 只放行 http/https，
     其余（javascript: / data: / 纯文字）一律返回空串 → 页面显示「官网待补充」，
     绝不会被原表内容带出可执行链接。 */
  const siteUrl = (u) => {
    let s = txt(u).replace(/[\s\u3000]+/g, '');
    if (!s) return '';
    if (/^\/\//.test(s)) s = 'https:' + s;
    else if (!/^[a-z][a-z0-9+.-]*:/i.test(s) && /^[\w-]+(\.[\w-]+)+/.test(s)) s = 'https://' + s;
    if (!/^https?:\/\/[^/?#]+/i.test(s)) return '';
    if (/[<>"']/.test(s)) return '';
    return s;
  };
  /* 只显示给人看的域名：去协议、去 www、去路径与查询串
     （带路径的如 ca.insight.com/en_CA/home.html 会把表格列撑宽，所以只留主机名） */
  const siteHost = (u) => {
    const s = siteUrl(u);
    if (!s) return '';
    const m = s.match(/^https?:\/\/([^/?#]+)/i);
    return m ? m[1].replace(/^www\./i, '') : '';
  };

  /* 金额 → 人读文本 */
  function money(v, opt) {
    if (v == null || !isFinite(v)) return '—';
    const o = opt || {};
    const abs = Math.abs(v);
    let s;
    if (abs >= 1e8) s = (v / 1e8).toFixed(abs >= 1e10 ? 0 : 1).replace(/\.0$/, '') + ' 亿美元';
    else if (abs >= 1e4) s = (v / 1e4).toFixed(abs >= 1e6 ? 0 : 1).replace(/\.0$/, '') + ' 万美元';
    else s = Math.round(v) + ' 美元';
    if (o.bare) s = s.replace(' 美元', '');
    return s;
  }

  /* 金额区间 → "$415亿 – $425亿" */
  function moneyRange(low, high) {
    if (low == null && high == null) return '—';
    if (low == null) return '≤ ' + money(high);
    if (high == null || Math.abs(high - low) < 1) return money(low);
    return money(low, { bare: true }) + ' – ' + money(high);
  }

  /* 紧凑版：单位相同时合并 → "1340–1380 亿美元" */
  function moneyRangeShort(low, high) {
    if (low == null && high == null) return '—';
    if (low == null) return '≤' + money(high);
    if (high == null || Math.abs(high - low) < 1) return money(low);
    const unit = (v) => (v >= 1e8 ? [v / 1e8, '亿'] : v >= 1e4 ? [v / 1e4, '万'] : [v, '']);
    const [a, ua] = unit(low);
    const [b, ub] = unit(high);
    const f = (x) => (x >= 100 ? Math.round(x) : Math.round(x * 10) / 10).toString();
    if (ua && ua === ub) return f(a) + '–' + f(b) + ' ' + ua + '美元';
    return money(low, { bare: true }) + '–' + money(high, { bare: true }) + ' 美元';
  }

  /* ============================================================
     金额解析：从「综合体量」自由文本中抽出美元金额区间
     支持 亿/万/B/M/K、加元/CAD 换算、文中自带美元换算优先
     ============================================================ */
  const CAD_RATE = 0.73; // 1 CAD ≈ 0.73 USD（可在方法页说明中调整口径）

  function normText(s) {
    return String(s || '')
      .replace(/[\uFF01-\uFF5E]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)) // 全角→半角
      .replace(/\u3000/g, ' ')
      .replace(/[，]/g, ',')
      .replace(/[\u2013\u2014\u2212]/g, '-')
      .replace(/(\d),(?=\d{3})/g, '$1'); // 去千分位
  }

  // 「数亿」这类模糊量：转成中值并打 approx 标记
  const VAGUE = [
    [/数百亿/g, '300亿', 1], [/数十亿/g, '30亿', 1],
    [/数千万/g, '5000万', 1], [/数百万/g, '500万', 1],
    [/数千[万亿]/g, '5000万', 1], [/数亿/g, '3亿', 1], [/数万/g, '5万', 1],
  ];

  function prepMoney(raw) {
    let t = normText(raw);
    let approx = false;
    if (/数[百千万亿]/.test(t)) approx = true;
    VAGUE.forEach(([re, to]) => { t = t.replace(re, to); });
    return { t, approx };
  }

  const CUR_RE = {
    cad: /加元|加币|CAD|C\$/i,
    usd: /美元|美金|USD/i,
  };

  /* 从一段文本里抽出 {low, high, cur, approx} */
  function rangeFrom(seg, approxFlag) {
    const s = seg;
    const amounts = [];
    const re = /(\$)?\s*(\d+(?:\.\d+)?)\s*(亿|万|千)?\s*(billion|million|[BMK])?/gi;
    let m;
    while ((m = re.exec(s)) !== null) {
      const dollar = !!m[1];
      const val = parseFloat(m[2]);
      const cn = m[3];
      const en = (m[4] || '').toUpperCase();
      if (!dollar && !cn && !en) continue;                 // 裸数字（年份、门店数、员工数）跳过
      if (!dollar && !cn && en && /^(19|20)\d\d$/.test(m[2])) continue;
      let mul = 1;
      if (cn === '亿') mul = 1e8;
      else if (cn === '万') mul = 1e4;
      else if (cn === '千') mul = 1e3;
      else if (en === 'B' || en === 'BILLION') mul = 1e9;
      else if (en === 'M' || en === 'MILLION') mul = 1e6;
      else if (en === 'K') mul = 1e3;
      const value = val * mul;
      // 币种：取匹配位置前后 14 字符
      const ctx = s.slice(Math.max(0, m.index - 6), m.index + m[0].length + 14);
      let cur = dollar ? 'USD' : null;
      if (CUR_RE.cad.test(ctx)) cur = 'CAD';
      else if (CUR_RE.usd.test(ctx)) cur = 'USD';
      amounts.push({ value, cur, dollar, index: m.index, txt: m[0].trim() });
    }
    if (!amounts.length) return null;

    // 币种归并：优先 USD（作者常在同一句里先写本币再给美元换算）
    const usd = amounts.filter((a) => a.cur === 'USD');
    const cad = amounts.filter((a) => a.cur === 'CAD');
    let pick = usd.length ? usd : cad.length ? cad : amounts;
    let cur = usd.length ? 'USD' : cad.length ? 'CAD' : 'USD';

    // 只取量级相近的一组，避免把「品牌营收」和「相关业务收入」混成区间
    pick = pick.slice().sort((a, b) => a.index - b.index);
    const base = pick[0].value;
    const group = pick.filter((a) => a.value >= base / 30 && a.value <= base * 30);
    const vals = group.map((a) => a.value).sort((a, b) => a - b);
    let low = vals[0], high = vals[vals.length - 1];
    if (cur === 'CAD') { low *= CAD_RATE; high *= CAD_RATE; }

    return {
      low, high,
      lowLocal: cur === 'CAD' ? vals[0] : null,
      highLocal: cur === 'CAD' ? vals[vals.length - 1] : null,
      cur, approx: !!approxFlag,
      evid: amounts.map((a) => a.txt).slice(0, 4).join(' / '),
    };
  }

  /**
   * parseMoney(text) -> {low, high, mid, cur, approx, via, evid, odd} | null
   * 口径优先级：主句（首个括号之前）> 括号内美元换算 > 全文
   * 主句若只有单点（如「数千万加元」），才退回括号里的美元区间
   */
  function parseMoney(raw) {
    const src = txt(raw);
    if (!src) return null;
    const { t, approx } = prepMoney(src);

    const parens = [];
    t.replace(/[（(]([^）)]*)[）)]/g, (all, inner) => { parens.push(inner); return all; });

    const main = t.split(/[（(]/)[0];
    const r1 = rangeFrom(main, approx);

    const finish = (r, via) => {
      if (!r) return null;
      const ratio = r.high && r.low ? r.high / r.low : 1;
      return Object.assign(r, {
        via: via || (r.cur === 'CAD' ? '加元按 0.73 折算' : '原表美元'),
        odd: ratio > 20,           // 区间跨度异常，进数据质量清单
      });
    };

    if (r1 && r1.low > 0 && Math.abs(r1.high - r1.low) > 1) {
      return finish(r1, r1.cur === 'CAD' ? '加元按 0.73 折算' : '原表美元');
    }

    // 主句是单点或没解析到 → 找括号里的美元区间
    for (const p of parens) {
      if (!CUR_RE.usd.test(p)) continue;
      if (/人民币|RMB|CNY/.test(p)) continue;
      const r = rangeFrom(p, approx);
      if (r && r.low > 0 && Math.abs(r.high - r.low) > 1) return finish(r, '文中自带美元换算');
    }

    if (r1 && r1.low > 0) return finish(r1, r1.cur === 'CAD' ? '加元按 0.73 折算' : '原表美元');

    for (const p of parens) {
      if (!CUR_RE.usd.test(p) || /人民币|RMB|CNY/.test(p)) continue;
      const r = rangeFrom(p, approx);
      if (r && r.low > 0) return finish(r, '文中自带美元换算');
    }

    const r2 = rangeFrom(t, approx);
    if (r2 && r2.low > 0) return finish(r2, r2.cur === 'CAD' ? '加元按 0.73 折算' : '原表美元');
    return null;
  }

  /* 体量分档（按美元年营收中值，log10） */
  const SCALE_TIERS = [
    { key: 'A', min: 1e10, label: 'A · ≥100 亿美元', short: '≥$100亿', color: '#B42318' },
    { key: 'B', min: 1e9, label: 'B · 10–100 亿美元', short: '$10–100亿', color: '#B54708' },
    { key: 'C', min: 1e8, label: 'C · 1–10 亿美元', short: '$1–10亿', color: '#1D4ED8' },
    { key: 'D', min: 1e7, label: 'D · 1,000 万–1 亿美元', short: '$1,000万–1亿', color: '#0E7490' },
    { key: 'E', min: 0, label: 'E · <1,000 万美元', short: '<$1,000万', color: '#667085' },
  ];
  function scaleTier(usd) {
    if (usd == null) return null;
    for (const t of SCALE_TIERS) if (usd >= t.min) return t;
    return SCALE_TIERS[SCALE_TIERS.length - 1];
  }

  /* ============================================================
     竞品 SKU 解析
     输入示例：
       Webcam:
       Logitech: 14 SKU ($24-184)
       Webcam:/Logitech: 8 SKU ($39-649)//PTZ Camera:/Vaddio: 99 SKU ($746-10244)
     输出：{ webcam:[{brand,sku,lo,hi}], ptz:[], console:[], other:[] }
     ============================================================ */
  const SEC_PATTERNS = [
    [/^web\s*cam/i, 'webcam'],
    [/^ptz/i, 'ptz'],
    [/^(live\s*stream|livestream|console|直播)/i, 'console'],
    [/^(video\s*bar|conference|会议)/i, 'console'],
  ];

  function parseSku(raw) {
    const out = { webcam: [], ptz: [], console: [], other: [] };
    const s = normText(raw);
    if (!s) return out;

    // 先按换行 + 斜杠切段（同一行里可能用 / 串多个品牌）
    const segs = s.split(/[\r\n\/|]+/).map((x) => x.trim()).filter(Boolean);

    let sec = 'other';
    segs.forEach((seg) => {
      const head = seg.replace(/[:：]\s*$/, '').trim();
      // 段落标题（不含 SKU 数字）
      if (!/\d+\s*SKU/i.test(seg)) {
        for (const [re, key] of SEC_PATTERNS) {
          if (re.test(head) && head.length <= 26) { sec = key; return; }
        }
        if (/^(品牌|brand)/i.test(head)) return;
      }
      const m = seg.match(/^(.+?)[:：]\s*([\d,]+)\s*(?:个)?\s*SKU\s*(?:[（(]?\s*\$?\s*([\d.,]+)?\s*(?:[-~至]\s*\$?\s*([\d.,]+))?)?/i);
      if (!m) {
        // 没有 SKU 数字但写了品牌名，记为 0 SKU 的占位（表示有该品牌但未量化）
        const m2 = seg.match(/^([A-Za-z0-9][\w .&'\-]{1,28})[:：]/);
        if (m2 && !/SKU/i.test(seg)) {
          const b = m2[1].trim();
          if (!/^(webcam|ptz|livestream|console)$/i.test(b)) out[sec].push({ brand: b, sku: null, lo: null, hi: null });
        }
        return;
      }
      const brand = m[1].trim().replace(/[:：]\s*$/, '');
      if (!brand || brand.length > 30) return;
      const sku = Number(m[2].replace(/,/g, ''));
      const lo = m[3] ? Number(m[3].replace(/,/g, '')) : null;
      const hi = m[4] ? Number(m[4].replace(/,/g, '')) : m[3] ? Number(m[3].replace(/,/g, '')) : null;
      out[sec].push({ brand, sku, lo, hi: hi == null ? lo : hi });
    });
    return out;
  }

  /* SKU 结构摘要 */
  function skuSummary(p) {
    const all = [].concat(p.webcam, p.ptz, p.console, p.other);
    const brands = {};
    all.forEach((x) => {
      const k = x.brand.toLowerCase();
      if (!brands[k]) brands[k] = { brand: x.brand, sku: 0, lo: null, hi: null, lines: {} };
      brands[k].sku += x.sku || 0;
      if (x.lo != null) brands[k].lo = brands[k].lo == null ? x.lo : Math.min(brands[k].lo, x.lo);
      if (x.hi != null) brands[k].hi = brands[k].hi == null ? x.hi : Math.max(brands[k].hi, x.hi);
    });
    const list = Object.values(brands).sort((a, b) => b.sku - a.sku);
    const sum = (arr, k) => arr.reduce((a, b) => a + (b[k] || 0), 0);
    const span = (arr) => {
      const los = arr.map((x) => x.lo).filter((v) => v != null);
      const his = arr.map((x) => x.hi).filter((v) => v != null);
      return { lo: los.length ? Math.min(...los) : null, hi: his.length ? Math.max(...his) : null };
    };
    const obs = list.find((b) => /obsbot/i.test(b.brand)) || null;
    const unsplit = !p.webcam.length && !p.ptz.length && p.other.length > 0;
    return {
      list,
      lines: p,
      unsplit,
      hasSection: p.webcam.length > 0 || p.ptz.length > 0,
      brandCount: list.filter((b) => b.sku > 0).length,
      webcamSku: sum(p.webcam, 'sku'),
      ptzSku: sum(p.ptz, 'sku'),
      consoleSku: sum(p.console, 'sku'),
      unsplitSku: sum(p.other, 'sku'),
      totalSku: sum(all, 'sku'),
      webcamSpan: span(p.webcam),
      ptzSpan: span(p.ptz),
      allSpan: span(all),
      obs,
      obsWebcam: (p.webcam.find((x) => /obsbot/i.test(x.brand)) || null),
      obsPtz: (p.ptz.find((x) => /obsbot/i.test(x.brand)) || null),
      hasInsta: list.some((b) => /insta\s*360/i.test(b.brand)),
      instaSku: (list.find((b) => /insta\s*360/i.test(b.brand)) || {}).sku || 0,
    };
  }

  /* 定性档位（用于无金额文本的体量描述） */
  const QUAL_TIERS = [
    [/极庞大|极强|绝对第一|全球最大|巨头/i, 92],
    [/庞大|巨大|庞大\(核心|核心主力|巨额/i, 82],
    [/中高|中上|较强/i, 68],
    [/中等|中\b|中低偏上/i, 55],
    [/中低|偏弱|有限/i, 38],
    [/极小|极弱|较弱|微|零星|几乎不|无相关/i, 16],
  ];
  function parseQual(raw) {
    const t = txt(raw);
    if (!t) return null;
    for (const [re, v] of QUAL_TIERS) if (re.test(t)) return { v, ev: t.slice(0, 60) };
    if (/大/.test(t)) return { v: 65, ev: t.slice(0, 60) };
    return { v: 45, ev: t.slice(0, 60) };
  }

  /* ============================================================
     图表（纯手写 SVG）
     ============================================================ */
  function svgWrap(w, h, inner, extra) {
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" ${extra || ''}>${inner}</svg>`;
  }

  function donut(items, opt) {
    const o = opt || {};
    const size = o.size || 180;
    const r = size / 2 - 14, cx = size / 2, cy = size / 2;
    const total = items.reduce((a, b) => a + (b.value || 0), 0) || 1;
    let acc = -Math.PI / 2;
    const arcs = items.filter((d) => d.value > 0).map((d) => {
      const ang = (d.value / total) * Math.PI * 2;
      const x1 = cx + r * Math.cos(acc), y1 = cy + r * Math.sin(acc);
      acc += ang;
      const x2 = cx + r * Math.cos(acc), y2 = cy + r * Math.sin(acc);
      const large = ang > Math.PI ? 1 : 0;
      const path = items.length === 1 || ang >= Math.PI * 2 - 0.001
        ? `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r}`
        : `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
      return { d, path };
    });
    const stroke = o.thickness || 20;
    const inner2 = arcs.map((a) => `<path d="${a.path}" fill="none" stroke="${a.d.color}" stroke-width="${stroke}" stroke-linecap="butt" transform="translate(${cx * 0} ${0})">
      <title>${esc(a.d.label)}：${a.d.value}</title></path>`).join('');
    const legend = items.map((d) => `<div class="lg"><i style="width:8px;height:8px;border-radius:2px;background:${d.color};display:inline-block"></i>
      <span style="font-size:11px;color:#475467">${esc(d.label)}</span>
      <b style="font-size:11.5px;font-variant-numeric:tabular-nums">${d.value}</b>
      <span style="font-size:10.5px;color:#98A2B3">${pctf(d.value, total)}%</span></div>`).join('');
    return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center">
      <div style="position:relative;flex:0 0 auto">${svgWrap(size, size, inner2)}
        <div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none">
          <div style="text-align:center"><div style="font-size:${size > 160 ? 21 : 17}px;font-weight:700;letter-spacing:-.02em">${o.centerValue == null ? total : o.centerValue}</div>
          <div style="font-size:10.5px;color:#98A2B3;margin-top:-1px">${esc(o.centerLabel || '合计')}</div></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">${legend}</div></div>`;
  }

  /* 横向条（值可为 null → 显示为「未量化」灰条） */
  function hbar(items, opt) {
    const o = opt || {};
    const rowH = o.rowH || 30;
    const W = 660, padL = o.padL || 150, padR = o.padR || 92, padT = 6;
    const H = padT * 2 + items.length * rowH;
    const max = o.max != null ? o.max : Math.max(1, ...items.map((d) => d.value || 0));
    const bw = W - padL - padR;
    const inner = items.map((d, i) => {
      const y = padT + i * rowH;
      const v = d.value;
      const w = v == null ? 0 : Math.max(2, (v / max) * bw);
      const col = d.color || C.brand;
      const label = d.label.length > 22 ? d.label.slice(0, 21) + '…' : d.label;
      return `<g class="hoverable">
        <title>${esc(d.label)}：${esc(d.text || (v == null ? '未量化' : v))}</title>
        <text x="${padL - 8}" y="${y + rowH / 2 + 3.5}" text-anchor="end" class="bar-lbl">${esc(label)}</text>
        <rect x="${padL}" y="${y + rowH / 2 - 6.5}" width="${bw}" height="13" rx="3" fill="#F1F3F6"/>
        ${v == null
          ? `<rect x="${padL}" y="${y + rowH / 2 - 6.5}" width="26" height="13" rx="3" fill="none" stroke="#D9DEE6" stroke-dasharray="3 2"/>`
          : `<rect x="${padL}" y="${y + rowH / 2 - 6.5}" width="${w.toFixed(1)}" height="13" rx="3" fill="${col}"/>`}
        <text x="${padL + Math.max(w, 0) + 6}" y="${y + rowH / 2 + 3.5}" class="bar-val">${esc(d.text || (v == null ? '未量化' : v))}</text>
      </g>`;
    }).join('');
    return svgWrap(W, H, inner);
  }

  /* 对数体量条：值域跨 4 个量级时用它 */
  function logBar(items, opt) {
    const o = opt || {};
    const rowH = o.rowH || 26;
    const W = 660, padL = o.padL || 168, padR = o.padR || 108, padT = 22;
    const H = padT * 2 + items.length * rowH;
    const bw = W - padL - padR;
    const lo = 6, hi = 11.4; // log10 美元：10^6 ~ 2.5e11
    const x = (v) => padL + ((Math.log10(Math.max(1, v)) - lo) / (hi - lo)) * bw;
    const ticks = [1e6, 1e7, 1e8, 1e9, 1e10, 1e11];
    const tickLbl = { 1e6: '$1M', 1e7: '$10M', 1e8: '$100M', 1e9: '$1B', 1e10: '$10B', 1e11: '$100B' };
    const grid = ticks.map((t) => `<g>
        <line x1="${x(t).toFixed(1)}" y1="${padT - 8}" x2="${x(t).toFixed(1)}" y2="${H - padT + 4}" class="gridline"/>
        <text x="${x(t).toFixed(1)}" y="${padT - 13}" text-anchor="middle" class="axis-lbl">${tickLbl[t]}</text></g>`).join('');
    const rows = items.map((d, i) => {
      const y = padT + i * rowH;
      const label = d.label.length > 24 ? d.label.slice(0, 23) + '…' : d.label;
      const cy = y + rowH / 2;
      if (d.value == null) {
        return `<g class="hoverable"><title>${esc(d.label)}：未量化</title>
          <text x="${padL - 8}" y="${cy + 3.5}" text-anchor="end" class="bar-lbl">${esc(label)}</text>
          <line x1="${padL}" y1="${cy}" x2="${padL + 22}" y2="${cy}" stroke="#D9DEE6" stroke-width="2" stroke-dasharray="3 2"/>
          <text x="${padL + 28}" y="${cy + 3.5}" class="axis-lbl">未量化</text></g>`;
      }
      const x1 = x(d.value);
      const col = d.color || C.brand;
      return `<g class="hoverable"><title>${esc(d.label)}：${esc(d.text || '')}</title>
        <text x="${padL - 8}" y="${cy + 3.5}" text-anchor="end" class="bar-lbl">${esc(label)}</text>
        <rect x="${padL}" y="${cy - 5}" width="${bw}" height="10" rx="2.5" fill="#F4F6F9"/>
        <rect x="${padL}" y="${cy - 5}" width="${Math.max(1.5, x1 - padL).toFixed(1)}" height="10" rx="2.5" fill="${col}"/>
        <circle cx="${x1.toFixed(1)}" cy="${cy}" r="2.6" fill="${col}" stroke="#fff" stroke-width="1.2"/>
        <text x="${(x1 + 7).toFixed(1)}" y="${cy + 3.5}" class="bar-val">${esc(d.text || money(d.value))}</text></g>`;
    }).join('');
    return svgWrap(W, H, grid + rows);
  }

  /* 分组柱 */
  function groupedBars(series, cats, opt) {
    const o = opt || {};
    const W = 660, H = o.height || 190, padL = 34, padR = 10, padT = 14, padB = 30;
    const bw = W - padL - padR, bh = H - padT - padB;
    const max = Math.max(1, ...series.flatMap((s) => s.data));
    const slot = bw / cats.length;
    const gw = Math.min(slot * 0.62, 46);
    const each = gw / series.length;
    const inner = series.map((s, si) => s.data.map((v, i) => {
      const h = (v / max) * bh;
      const x = padL + slot * i + (slot - gw) / 2 + each * si;
      const y = padT + bh - h;
      return `<g class="hoverable"><title>${esc(s.name)} · ${esc(cats[i])}：${v}</title>
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(each - 2).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="2.5" fill="${s.color}"/>
        ${v ? `<text x="${(x + (each - 2) / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" class="bar-val" style="font-size:10px">${v}</text>` : ''}</g>`;
    }).join('')).join('');
    const axis = cats.map((c, i) => `<text x="${(padL + slot * i + slot / 2).toFixed(1)}" y="${H - padB + 15}" text-anchor="middle" class="axis-lbl">${esc(c)}</text>`).join('');
    const base = `<line x1="${padL}" y1="${padT + bh}" x2="${W - padR}" y2="${padT + bh}" stroke="#E3E7ED"/>`;
    const legend = series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
    return svgWrap(W, H, base + inner + axis) + `<div class="legend">${legend}</div>`;
  }

  /* 散点（x 可对数） */
  function scatter(pts, opt) {
    const o = opt || {};
    const W = 660, H = o.height || 300, padL = 52, padR = 18, padT = 16, padB = 40;
    const bw = W - padL - padR, bh = H - padT - padB;
    const xs = pts.map((p) => p.x).filter((v) => v != null && isFinite(v));
    const ys = pts.map((p) => p.y).filter((v) => v != null && isFinite(v));
    const xlo = o.xLog ? Math.log10(Math.max(1e5, Math.min(...xs))) : Math.min(...xs);
    const xhi = o.xLog ? Math.log10(Math.max(1e6, Math.max(...xs)) * 1.1) : Math.max(...xs) * 1.05;
    const ylo = o.yLog ? Math.log10(Math.max(1, Math.min(...ys))) : 0;
    const yhi = o.yLog ? Math.log10(Math.max(2, Math.max(...ys)) * 1.1) : Math.max(...ys) * 1.08;
    const px = (v) => padL + ((o.xLog ? Math.log10(Math.max(1, v)) : v) - xlo) / (xhi - xlo || 1) * bw;
    const py = (v) => padT + bh - ((o.yLog ? Math.log10(Math.max(1, v)) : v) - ylo) / (yhi - ylo || 1) * bh;
    const dots = pts.map((p) => {
      if (p.x == null || p.y == null) return '';
      return `<g class="hoverable"><title>${esc(p.label)}：${esc(p.tip || '')}</title>
        <circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="${p.r || 4.2}" fill="${p.color || C.brand}" fill-opacity=".72" stroke="#fff" stroke-width="1.1"/></g>`;
    }).join('');
    const xTicks = o.xTicks || [];
    const xg = xTicks.map((t) => `<g><line x1="${px(t.v).toFixed(1)}" y1="${padT}" x2="${px(t.v).toFixed(1)}" y2="${padT + bh}" class="gridline"/>
      <text x="${px(t.v).toFixed(1)}" y="${H - padB + 15}" text-anchor="middle" class="axis-lbl">${esc(t.label)}</text></g>`).join('');
    const yTicks = o.yTicks || [];
    const yg = yTicks.map((t) => `<g><line x1="${padL}" y1="${py(t.v).toFixed(1)}" x2="${W - padR}" y2="${py(t.v).toFixed(1)}" class="gridline"/>
      <text x="${padL - 7}" y="${(py(t.v) + 3.5).toFixed(1)}" text-anchor="end" class="axis-lbl">${esc(t.label)}</text></g>`).join('');
    const xlab = o.xLabel ? `<text x="${padL + bw / 2}" y="${H - 6}" text-anchor="middle" class="axis-lbl">${esc(o.xLabel)}</text>` : '';
    const ylab = o.yLabel ? `<text transform="translate(12 ${padT + bh / 2}) rotate(-90)" text-anchor="middle" class="axis-lbl">${esc(o.yLabel)}</text>` : '';
    return svgWrap(W, H, xg + yg + dots + xlab + ylab + `<line x1="${padL}" y1="${padT + bh}" x2="${W - padR}" y2="${padT + bh}" stroke="#E3E7ED"/>`);
  }

  /* 漏斗 */
  function funnel(steps) {
    const W = 660, rowH = 46, H = steps.length * rowH + 8;
    const max = Math.max(1, ...steps.map((s) => s.value || 0));
    const bw = W - 210;
    const rows = steps.map((s, i) => {
      const y = 4 + i * rowH;
      const w = s.missing ? bw * 0.16 : Math.max(3, (s.value / max) * bw);
      const col = s.missing ? '#D9DEE6' : [C.brand, C.brand2, '#7BA3F7', C.teal][i % 4];
      return `<g><text x="0" y="${y + 21}" class="bar-lbl">${esc(s.label)}</text>
        <rect x="132" y="${y + 8}" width="${bw}" height="20" rx="4" fill="#F4F6F9"/>
        ${s.missing
          ? `<rect x="132" y="${y + 8}" width="${w}" height="20" rx="4" fill="none" stroke="#D9DEE6" stroke-dasharray="3 3"/>`
          : `<rect x="132" y="${y + 8}" width="${w.toFixed(1)}" height="20" rx="4" fill="${col}"/>`}
        <text x="${132 + w + 8}" y="${y + 22}" class="bar-val">${s.missing ? (s.value || 0) : s.value}</text>
        <text x="${W - 4}" y="${y + 22}" text-anchor="end" class="axis-lbl">${esc(s.rate || '')}</text></g>`;
    }).join('');
    return svgWrap(W, H, rows);
  }

  /* 价格带梯（单个客户的竞品价格分布 + OBSBOT 建议落位） */
  function priceLadder(rows, opt) {
    const o = opt || {};
    const W = o.width || 620, rowH = 22, padL = 118, padR = 26, padT = 26;
    const H = padT + rows.length * rowH + 26;
    const maxP = Math.max(200, ...rows.map((r) => r.hi || 0), ...(o.marks || []).map((m) => m.hi || 0)) * 1.06;
    const bw = W - padL - padR;
    const x = (v) => padL + (Math.min(v, maxP) / maxP) * bw;
    const ticks = [0, 100, 250, 500, 1000, 2000].filter((t) => t <= maxP);
    const grid = ticks.map((t) => `<g><line x1="${x(t).toFixed(1)}" y1="${padT - 10}" x2="${x(t).toFixed(1)}" y2="${H - 22}" class="gridline"/>
      <text x="${x(t).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="axis-lbl">$${t}</text></g>`).join('');
    const bars = rows.map((r, i) => {
      const y = padT + i * rowH;
      const lo = r.lo == null ? 0 : r.lo;
      const hi = r.hi == null ? lo : r.hi;
      const isObs = /obsbot/i.test(r.brand);
      return `<g class="hoverable"><title>${esc(r.brand)}：${r.sku || 0} SKU，$${lo}–${hi}</title>
        <text x="${padL - 8}" y="${y + 11}" text-anchor="end" class="bar-lbl" style="${isObs ? 'font-weight:700;fill:#1D4ED8' : ''}">${esc(r.brand)}</text>
        ${r.sku ? `<text x="${padL - 8}" y="${y + 11}" text-anchor="end" class="bar-lbl" style="opacity:0">.</text>` : ''}
        <line x1="${x(lo).toFixed(1)}" y1="${y + 7}" x2="${x(hi).toFixed(1)}" y2="${y + 7}" stroke="${isObs ? C.brand : '#CBD5E1'}" stroke-width="${isObs ? 7 : 5.5}" stroke-linecap="round"/>
        <circle cx="${x(lo).toFixed(1)}" cy="${y + 7}" r="2.1" fill="#fff" stroke="${isObs ? C.brand : '#94A3B8'}" stroke-width="1.3"/>
        <circle cx="${x(hi).toFixed(1)}" cy="${y + 7}" r="2.1" fill="#fff" stroke="${isObs ? C.brand : '#94A3B8'}" stroke-width="1.3"/>
        <text x="${(x(hi) + 5).toFixed(1)}" y="${y + 10.5}" class="axis-lbl" style="font-variant-numeric:tabular-nums">${esc(String(r.sku || ''))}${r.sku ? ' SKU' : ''}</text>
      </g>`;
    }).join('');
    const marks = (o.marks || []).map((m) => {
      const cx = x((m.lo + m.hi) / 2);
      return `<g><rect x="${x(m.lo).toFixed(1)}" y="${padT - 20}" width="${Math.max(6, x(m.hi) - x(m.lo)).toFixed(1)}" height="9" rx="2.5" fill="${C.brand}" fill-opacity=".85"/>
        <text x="${cx.toFixed(1)}" y="${padT - 24}" text-anchor="middle" class="axis-lbl" style="fill:#1D4ED8;font-weight:700">${esc(m.name)}</text></g>`;
    }).join('');
    return svgWrap(W, H, grid + bars + marks);
  }

  /* 竞品矩阵热力（品牌 × 客户） */
  function heatMatrix(rows, cols, cell, opt) {
    const o = opt || {};
    const cw = o.cw || 46, rowH = o.rowH || 26, padL = o.padL || 140, padT = 74;
    const W = padL + cols.length * cw + 8;
    const H = padT + rows.length * rowH + 8;
    const head = cols.map((c, j) => `<text transform="translate(${padL + j * cw + cw / 2} ${padT - 8}) rotate(-42)" text-anchor="start" class="axis-lbl" style="font-size:9.6px">${esc(c.label)}</text>`).join('');
    const body = rows.map((r, i) => {
      const y = padT + i * rowH;
      const cells = cols.map((c, j) => {
        const v = cell(r, c);
        if (!v || !v.sku) return `<rect x="${padL + j * cw + 1}" y="${y + 1}" width="${cw - 2}" height="${rowH - 2}" fill="#FAFBFC"/>`;
        const t = Math.min(1, Math.log10(1 + v.sku) / Math.log10(80));
        const col = v.isObs ? `rgba(29,78,216,${0.18 + t * 0.8})` : `rgba(181,71,8,${0.14 + t * 0.74})`;
        const tc = t > 0.42 ? '#fff' : '#0F1729';
        return `<g class="hoverable"><title>${esc(r.label)} × ${esc(c.label)}：${v.sku} SKU${v.lo != null ? ` ($${v.lo}-${v.hi})` : ''}</title>
          <rect x="${padL + j * cw + 1}" y="${y + 1}" width="${cw - 2}" height="${rowH - 2}" rx="2.5" fill="${col}"/>
          <text x="${padL + j * cw + cw / 2}" y="${y + rowH / 2 + 3.4}" text-anchor="middle" style="font-size:9.6px;font-weight:650;fill:${tc}">${v.sku}</text></g>`;
      }).join('');
      return `<g><text x="${padL - 7}" y="${y + rowH / 2 + 3.4}" text-anchor="end" class="bar-lbl" style="font-size:10.4px">${esc(r.label.length > 20 ? r.label.slice(0, 19) + '…' : r.label)}</text>${cells}</g>`;
    }).join('');
    return svgWrap(W, H, head + body, `style="min-width:${Math.min(W, 1500)}px"`);
  }

  global.CORE = {
    C, P_STYLE, esc, txt, num, pctf, money, moneyRange, moneyRangeShort, parseMoney, CAD_RATE,
    siteUrl, siteHost, iso2, countryLabel,
    SCALE_TIERS, scaleTier, parseSku, skuSummary, parseQual, normText,
    donut, hbar, logBar, groupedBars, scatter, funnel, priceLadder, heatMatrix, svgWrap,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ============================================================
   model.js — 数据建模：零售商 / 代理集成商 两套独立口径
   - 综合体量 → 美元区间（加元按 0.73 折算）
   - 竞品 SKU 结构 → OBSBOT 产品入驻预判
   - 代理集成商 P1~P3 判定（原表已标注者以原表为准）
   ============================================================ */
(function (global) {
  'use strict';
  const CORE = global.CORE;
  const { txt, num, iso2, parseMoney, parseSku, skuSummary, parseQual, scaleTier, moneyRange, pctf, money } = CORE;

  const SRC = global.__DATA__ || { sheets: [] };
  const S1 = SRC.sheets[0] || { headers: [], rows: [] };
  const S2 = SRC.sheets[1] || { headers: [], rows: [] };
  const S3 = SRC.sheets[2] || { headers: [], rows: [] };
  /* 各表的「原表客户 / 新增客户」分界（构建时算好）：索引 >= 这个值就是新增池里的名单 */
  const NEW_FROM = SRC.newFrom || {};

  const APP = {
    retailers: [], agents: [], customers: [],
    platform: [], meta: {},
    hqMissing: [], parseIssues: [],
  };

  /* ---------- OBSBOT 产品目录（价格位取自「头部品牌与竞品格局」表内自述价格带） ---------- */
  const PRODUCTS = [
    { key: 'Tiny SE', lo: 89, hi: 129, line: 'AI 追踪', role: '入门走量', note: '打 NexiGo / Onn / 白牌低价位' },
    { key: 'Tiny 3 Lite', lo: 129, hi: 199, line: 'AI 追踪', role: '入门主力', note: '对位 Insta360 Link 2 / Logitech Brio 500' },
    { key: 'Meet 2', lo: 149, hi: 249, line: '会议办公', role: '会议位', note: '对位 Logitech Brio / Poly / Microsoft / Dell' },
    { key: 'Tiny 3', lo: 249, hi: 349, line: 'AI 追踪', role: '主力', note: '对位 Insta360 Link 2 Pro / Razer Kiyo Pro' },
    { key: 'Tail 2', lo: 549, hi: 1299, line: 'PTZ 直播', role: '专业位', note: '对位 PTZOptics / AVer / BirdDog / BZBGEAR / 低端 Sony' },
  ];
  const PROD = {};
  PRODUCTS.forEach((p) => (PROD[p.key] = p));

  const CONF_BRANDS = /yealink|poly|jabra|cisco|microsoft|konftel|huddly|aver|avermedia|lumens|neat|dell|hp\b|lenovo/i;

  /* ---------- 门店数量 ---------- */
  function parseStore(v) {
    const t = txt(v);
    if (!t) return { n: null, text: '', approx: false };
    const m = t.match(/([><≥≤约]*)\s*([\d,]+)\s*(?:[-–~至]\s*([\d,]+))?/);
    if (!m) return { n: null, text: t, approx: false };
    const lo = num(m[2]);
    const hi = m[3] ? num(m[3]) : null;
    const approx = !!m[1] || !!hi;
    const n = hi != null ? Math.round((lo + hi) / 2) : lo;
    return { n, text: t, approx, prefix: m[1] || '' };
  }

  /* ============================================================
     OBSBOT 入驻预判（零售商：基于竞品 SKU + 价格带）
     ============================================================ */
  function recommendProducts(c) {
    const sm = c.sku;
    const out = { items: [], gaps: [], headline: '', level: '低', basis: [] };
    if (!sm.brandCount) {
      out.headline = '原表未记录竞品 SKU / 价格带，暂不做型号预判';
      out.level = '未知';
      return out;
    }

    // 统一口径：有分区用 webcam，否则用「未分线」
    const pool = sm.lines.webcam.length ? sm.lines.webcam : sm.lines.other;
    const poolLabel = sm.lines.webcam.length ? 'Webcam' : '未分线摄像头';
    const lo = Math.min(...pool.map((x) => x.lo).filter((v) => v != null));
    const hi = Math.max(...pool.map((x) => x.hi).filter((v) => v != null));
    const brandsIn = (a, b) => pool.filter((x) => x.hi != null && x.hi >= a && x.lo <= b).map((x) => x.brand);
    const add = (key, w, why) => {
      const exist = out.items.find((i) => i.key === key);
      if (exist) { if (w > exist.w) { exist.w = w; exist.why = why; } return; }
      out.items.push({ key, w, why, prod: PROD[key] });
    };

    out.basis.push(`竞品 ${sm.brandCount} 个品牌 / ${sm.totalSku} 个 SKU，价格跨度 $${lo}–${hi}（${poolLabel}）`);

    // 规则 A：Insta360 已验证 AI 云台追踪
    if (sm.instaSku >= 3) {
      add('Tiny 3', 96, `已上 Insta360 ${sm.instaSku} 款，AI 云台追踪有品类认知，用 Tiny 3 直接对位 Link 2 Pro`);
      add('Tiny 3 Lite', 82, `Insta360 价位 $149–299 已跑通，Tiny 3 Lite 补其下方 $129–199 入口`);
      out.basis.push(`Insta360 ${sm.instaSku} SKU 在架 → AI 云台追踪需求已被验证`);
    } else if (sm.instaSku > 0) {
      add('Tiny 3 Lite', 70, `已有 Insta360 ${sm.instaSku} 款，先用 Tiny 3 Lite 低价位试水该品类`);
    }

    // 规则 B：OBSBOT 已在架 → 看缺口
    if (sm.obs && sm.obs.sku > 0) {
      const obsHi = sm.obs.hi;
      out.basis.push(`OBSBOT 已在架 ${sm.obs.sku} SKU，价格上限 $${obsHi}`);
      if (obsHi != null && obsHi <= 360) {
        if (sm.lines.ptz.length || sm.ptzSku > 0) {
          add('Tail 2', 90, `在架上限仅 $${obsHi}，专业 PTZ 位（$${PROD['Tail 2'].lo}+）完全空缺，Tail 2 是最直接的增量`);
        } else {
          add('Tiny 3', 72, `在架上限 $${obsHi}，主力 AI 追踪位缺一款，补 Tiny 3 拉开价格梯度`);
        }
      }
      if (sm.obs.sku <= 6) {
        add('Tiny 3 Lite', 58, `在架仅 ${sm.obs.sku} SKU，系列覆盖偏窄，用 Tiny 3 Lite 补入门位形成价格梯`);
      }
    } else {
      // 规则 C：完全未在架 → 找入口缺口
      const entry = brandsIn(100, 200);
      const ultra = brandsIn(0, 100);
      if (!entry.length) {
        add('Tiny 3 Lite', 88, `$100–200 段目前无品牌占位，Tiny 3 Lite 可直接切入空白价格带`);
      } else if (ultra.length >= 2) {
        add('Tiny SE', 66, `$100 以下有 ${ultra.slice(0, 3).join('、')} 等 ${ultra.length} 家贴身肉搏，改用 Tiny SE 卡位、避免与白牌正面对撞`);
        add('Tiny 3 Lite', 60, `低价位已被占满，向上用 Tiny 3 Lite 承接有 AI 追踪需求的客群`);
      }
      out.basis.push('OBSBOT 当前未在架（原表无 OBSBOT SKU 记录）');
    }

    // 规则 D：会议/办公场景品牌入场 → Meet 2
    const confHit = sm.list.filter((b) => CONF_BRANDS.test(b.brand)).map((b) => b.brand);
    if (confHit.length >= 2) {
      add('Meet 2', 74, `在售 ${confHit.slice(0, 3).join('、')} 等 ${confHit.length} 个办公/会议品牌，Meet 2 可切会议与远程办公位`);
      out.basis.push(`办公/会议类品牌 ${confHit.length} 个：${confHit.slice(0, 4).join('、')}`);
    }

    // 规则 E：PTZ 段
    if (sm.lines.ptz.length && !(sm.obsPtz && sm.obsPtz.sku > 0)) {
      const ptzHi = sm.ptzSpan.hi;
      const mid = sm.lines.ptz.filter((x) => x.hi != null && x.hi >= 500 && x.lo <= 1500);
      if (!mid.length) {
        add('Tail 2', 86, `PTZ 段共 ${sm.ptzSku} SKU 但 $500–1,500 中端缺失，Tail 2 正好落在空档`);
      } else if (ptzHi != null && ptzHi >= 3000) {
        add('Tail 2', 78, `PTZ 段上限 $${ptzHi}（专业级），Tail 2 用性价比位承接预算敏感的教育/中型会议室`);
      } else {
        add('Tail 2', 62, `PTZ 段已有 ${sm.ptzSku} SKU 基础，OBSBOT 尚未进入，Tail 2 可补位`);
      }
    }

    // 价格带缺口汇总（对 OBSBOT 有意义的三段）
    [['Tiny 3 Lite', PROD['Tiny 3 Lite']], ['Tiny 3', PROD['Tiny 3']], ['Tail 2', PROD['Tail 2']]].forEach(([k, p]) => {
      const who = brandsIn(p.lo, p.hi);
      if (!who.length) out.gaps.push({ band: p, who: [] });
    });

    out.items.sort((a, b) => b.w - a.w);
    // 大型商超/连锁不进 Tiny SE（$100 以下不是它们的排面语言）
    if (c.p === 'P1' && (c.tier && (c.tier.key === 'A' || c.tier.key === 'B'))) {
      out.items = out.items.filter((i) => i.key !== 'Tiny SE');
    }
    out.items = out.items.slice(0, 3);

    // 已形成完整价格梯：不再建议新增型号，转为排面/主推位之争
    if (!out.items.length && sm.obs && sm.obs.sku >= 8) {
      out.headline = `OBSBOT 已上 ${sm.obs.sku} SKU、价格梯 $${sm.obs.lo}–${sm.obs.hi}，无需新增型号，转为争排面与主推位`;
      out.level = '维持';
      out.basis.push(`OBSBOT 在该店已覆盖入门到专业位，属于存量经营阶段`);
      return out;
    }

    out.level = out.items.length >= 2 && out.items[0].w >= 80 ? '高' : out.items.length ? '中' : '低';
    out.headline = out.items.length
      ? `主推 ${out.items.map((i) => i.key).join(' + ')}`
      : '暂无明确缺口，维持现有结构观察';
    return out;
  }

  /* ---------- 原表字段原样保留（供详情抽屉） ---------- */
  function rawOf(sheet, row) {
    const o = {};
    sheet.headers.forEach((h, i) => {
      if (!h) return;
      const v = row[i];
      o[h] = v == null ? '' : String(v);
    });
    return o;
  }

  /* ============================================================
     零售商
     ============================================================ */
  function buildRetailer(row, i) {
    const g = (n) => { const k = S1.headers.indexOf(n); return k < 0 ? null : row[k]; };
    const name = txt(g('客户名'));
    const intro = txt(g('一句话简介'));
    const scaleText = txt(g('综合体量'));
    const mny = parseMoney(scaleText);
    const store = parseStore(g('门店数量'));
    const skuRaw = txt(g('头部竞品品牌体量'));
    const sku = skuSummary(parseSku(skuRaw));
    const p = (txt(g('优先级')) || '').toUpperCase().match(/P[123]/);
    const coopRaw = txt(g('是否在合作'));
    const coop = /^是/.test(coopRaw) || /已合作/.test(coopRaw) ? '已合作' : /^否/.test(coopRaw) ? '未合作' : '待核实';
    const contactRaw = txt(g('是否建联'));
    const contact = /^是/.test(contactRaw) ? '是' : /^否/.test(contactRaw) ? '否' : '待核实';
    const webcamOn = txt(g('是否在售webcam'));

    const c = {
      id: 'r' + i, type: 'retailer', typeLabel: '零售商',
      name: name.trim(),
      country: iso2(g('国家')),
      intro, url: txt(g('官网')),
      p: p ? p[0] : null,
      pSource: p ? '原表标注' : '缺失',
      scaleText, mny,
      scaleMid: mny ? (mny.low + mny.high) / 2 : null,
      tier: mny ? scaleTier((mny.low + mny.high) / 2) : null,
      store,
      coverage: txt(g('覆盖范围')),
      webcamOn,
      skuRaw, sku,
      coop, coopRaw, contact, contactRaw,
      note: txt(g('备注')),
    };
    c.advice = recommendProducts(c);
    c.raw = rawOf(S1, row);
    return c;
  }

  /* ============================================================
     渠道角色：分销商 / 代理商
     ------------------------------------------------------------
     判定只看「一句话简介」的原文含义：
       分销商 —— 向下一级渠道批量供货、备库存，自己不直接做终端项目
       代理商 —— 面向终端客户或项目销售（含厂方代表、VAR·直销、系统集成商）
     简介是营销措辞（例如 CDW、Insight 被写成「系统集成商」，实际是面向终端的
     VAR 直销），纯关键词会误判，所以对当前 60 家逐家复核后钉一张定论表；
     why 存判断依据的原句，方便随时核对。表里没有的新客户退化为关键词判断，
     判不出来的老实标「待判断」，不硬凑。
     ============================================================ */

    unknown: { sub: '待判断', bin: '待判断', color: 'na' },

    'Provantage': ['var', '「B2B/B2C 科技垂直采购平台」'],

    // —— 系统集成商（按项目设计安装，不备货分销）——
    'ET Group': ['integ', '「企业级音视频集成商、UCC 工程商」'],
    'SparkAV Ltd.': ['integ', '「AV 工程设计与 UCC 系统集成商」'],

    'AVI-SPL Canada': ['integ', '「AVI-SPL 加拿大分公司、系统集成」'],

    'VidCom': ['integ', '「集成总代理商与系统集成商」，以集成项目为主'],
    'AV8 Technologies': ['integ', '「系统集成商、会议室交付服务商」'],
    'FORTÉ': ['integ', '「系统集成巨头」'],
    'AVI-SPL': ['integ', '「全球最大音视频系统集成巨头」'],
  };

  function channelRole(name, intro) {
    const fixed = ROLE_FIX[String(name || '').trim()];
    if (fixed) {
      const m = ROLE_SUB[fixed[0]];
      return { key: fixed[0], sub: m.sub, bin: m.bin, color: m.color, why: fixed[1], conf: '高' };
    }
    const t = intro || '';
    let k = '', why = '';
    if (/厂方代表/.test(t)) { k = 'rep'; why = '简介含「厂方代表」'; }
    else if (/分销商|增值分销|批发|总代理/.test(t) && !/直销|零售|电商|集成商|工程商/.test(t)) {
      k = 'dist'; why = '简介含「分销 / 批发 / 总代理」';
    } else if (/集成商|工程商|工程承包|系统集成/.test(t)) { k = 'integ'; why = '简介含「集成商 / 工程商」'; }
    else if (/直销|电商|零售|经销商|VAR|采购平台/.test(t)) { k = 'var'; why = '简介含「直销 / 电商 / 经销商」'; }
    if (!k) {
      const m = ROLE_SUB.unknown;
      return { key: 'unknown', sub: m.sub, bin: m.bin, color: m.color, why: '简介未提及渠道角色，需人工确认', conf: '低' };
    }
    const m = ROLE_SUB[k];
    return { key: k, sub: m.sub, bin: m.bin, color: m.color, why, conf: '中' };
  }

  /* ============================================================
     代理集成商 P1~P3 判定
     参考零售商已标注口径：品类契合（是否真的卖 webcam/PTZ）优先于公司总营收
     ============================================================ */
  const LINE_RE = {
    webcam: /web\s*cam|摄像头/i,
    ptz: /ptz|云台/i,
    console: /livestream|live\s*stream|console|直播/i,
  };

  function buildAgent(row, i) {
    const g = (n) => { const k = S2.headers.indexOf(n); return k < 0 ? null : row[k]; };
    const name = txt(g('客户名'));
    const intro = txt(g('一句话简介'));
    const scaleText = txt(g('综合体量'));
    const mny = parseMoney(scaleText);
    const linesRaw = txt(g('相关产品线'));
    const lines = {
      webcam: LINE_RE.webcam.test(linesRaw),
      ptz: LINE_RE.ptz.test(linesRaw),
      console: LINE_RE.console.test(linesRaw),
    };
    const relVol = txt(g('相关产品线体量（可推测/预估）'));
    const compRaw = txt(g('合作竞品'));
    const sku = skuSummary(parseSku(compRaw));
    const directComp = /^是/.test(txt(g('是否代理直接竞品')));
    const coopRaw = txt(g('是否在合作'));
    const coop = /^是/.test(coopRaw) || /已合作/.test(coopRaw) ? '已合作' : /^否/.test(coopRaw) ? '未合作' : '待核实';
    const contactRaw = txt(g('是否建联'));
    const contact = /^是/.test(contactRaw) ? '是' : /^否/.test(contactRaw) ? '否' : '待核实';
    const pOrigin = (txt(g('优先级')) || '').toUpperCase().match(/P[123]/);

    const c = {
      id: 'a' + i, type: 'agent', typeLabel: '代理 / 集成商',
      name: name.trim(),
      country: iso2(g('国家')),
      intro, url: txt(g('官网')),
      p: pOrigin ? pOrigin[0] : null,
      pSource: pOrigin ? '原表标注' : '模型判定',
      scaleText, mny,
      scaleMid: mny ? (mny.low + mny.high) / 2 : null,
      tier: mny ? scaleTier((mny.low + mny.high) / 2) : null,
      coverage: txt(g('覆盖区域')),
      mainCats: txt(g('主要品类')),
      compRaw, sku, directComp,
      linesRaw, lines, relVol,
      coop, coopRaw, contact, contactRaw,
      note: txt(g('备注')),
    };
    c.advice = recommendForAgent(c);
    c.raw = rawOf(S2, row);
    c.role = channelRole(c.name, intro);
    c.judge = judgeAgent(c);
    c.pModel = c.judge.p;
    if (!c.p) c.p = c.pModel;
    c.pConflict = !!(pOrigin && c.judge.p !== pOrigin[0]);
    return c;
  }

  /* 体量分（0–100） */
  function scaleScore(c) {
    const v = c.scaleMid;
    if (v == null) return { v: 45, why: '体量为定性描述，未披露金额（按中性 45 计）' };
    const L = Math.log10(v);
    let s;
    if (L >= 10.3) s = 92;
    else if (L >= 9.7) s = 86;
    else if (L >= 9.0) s = 78;
    else if (L >= 8.3) s = 70;
    else if (L >= 7.6) s = 60;
    else if (L >= 7.0) s = 48;
    else if (L >= 6.4) s = 34;
    else s = 22;
    return { v: s, why: `年营收约 ${moneyRange(c.mny.low, c.mny.high)}（${c.mny.cur === 'CAD' ? '原表加元折算' : c.mny.via}）` };
  }

  /* 品类契合分（0–100）：Webcam / PTZ 两条产品线各自取「明确 SKU 数」优先、定性档位兜底 */
  const CNT_SCORE = [[500, 96], [300, 90], [150, 82], [80, 72], [40, 62], [15, 50], [0, 38]];
  function scoreFromCount(n) {
    for (const [min, v] of CNT_SCORE) if (n >= min) return v;
    return 30;
  }
  function maxCountIn(text) {
    const nums = [...String(text || '').matchAll(/(\d[\d,]*)\s*\+?\s*(?:个\s*)?(?:SKU|款|个型号)/gi)]
      .map((m) => Number(m[1].replace(/,/g, '')))
      .filter((n) => n > 0 && n < 100000);
    return nums.length ? Math.max(...nums) : null;
  }

  function fitScore(c) {
    const rel = String(c.relVol || '');
    const lines = rel.split(/\r?\n/);
    const seg = (re) => {
      const hit = lines.find((l) => re.test(l));
      return hit || null;
    };
    const valOf = (line, fallbackQual) => {
      if (!line) return null;
      const n = maxCountIn(line);
      if (n != null) return { v: scoreFromCount(n), ev: `${n} SKU/款` };
      const q = parseQual(line);
      return q ? { v: q.v, ev: q.ev.slice(0, 40) } : { v: fallbackQual, ev: '定性' };
    };
    const whole = parseQual(rel);
    const wSeg = valOf(seg(/web\s*cam/i), whole ? whole.v : 45);
    const pSeg = valOf(seg(/ptz/i), whole ? whole.v : 45);
    let v;
    let why;
    if (wSeg && pSeg) {
      v = Math.round(wSeg.v * 0.55 + pSeg.v * 0.45);
      why = `Webcam ${wSeg.v}（${wSeg.ev}）· PTZ ${pSeg.v}（${pSeg.ev}）`;
    } else if (wSeg || pSeg) {
      const one = wSeg || pSeg;
      v = Math.round(one.v * 0.88 + (whole ? whole.v : 45) * 0.12);
      why = `${wSeg ? 'Webcam' : 'PTZ'} ${one.v}（${one.ev}）· 另一线未描述`;
    } else {
      v = whole ? whole.v : 40;
      why = '未分线描述，按整体量级取分';
    }
    const lineBonus = (c.lines.webcam ? 5 : 0) + (c.lines.ptz ? 5 : 0) + (c.lines.console ? 2 : 0);
    v = Math.min(100, v + lineBonus);
    if (/obsbot/i.test(rel)) v = Math.min(100, v + 3);
    return { v, why: why + (lineBonus ? ` · 产品线命中 +${lineBonus}` : '') };
  }

  /* 推进阶段分 */
  function stageScore(c) {
    if (c.coop === '已合作') return { v: 92, why: '已在合作' };
    if (c.contact === '是') return { v: 58, why: '未合作但已建联' };
    if (c.contact === '否') return { v: 26, why: '未合作且未建联' };
    return { v: 34, why: '合作/建联状态待核实' };
  }

  function judgeAgent(c) {
    const s = scaleScore(c), f = fitScore(c), m = stageScore(c);
    const ch = c.role ? c.role.key : 'unknown';   // 渠道角色（见 channelRole）
    const composite = Math.round(f.v * 0.45 + s.v * 0.32 + m.v * 0.23);
    let p;
    // 阈值用原表 60 家人工 P 码回校准（一致 42/60 ≈ 70%）：综合分切 72 / 67
    if (composite >= 72) p = 'P1';
    else if (composite >= 67) p = 'P2';
    else p = 'P3';
    if (f.v < 45) p = 'P3';                        // 品类契合过低一律 P3
    const conf = f.v >= 70 && c.mny ? '较高' : f.v >= 60 ? '中' : '偏低（品类或金额记录不完整）';
    return {
      p, composite, ch, chLabel: c.role ? c.role.sub : '待判断', conf,
      factors: [f, s, m],
      why: `品类契合 ${f.v}×45% + 渠道体量 ${s.v}×32% + 推进阶段 ${m.v}×23% = ${composite}`,
    };
  }

  /* 代理的产品建议（无 SKU 明细，按产品线 + 竞品品牌推断） */
  function recommendForAgent(c) {
    const out = { items: [], headline: '', level: '中' };
    const rel = String(c.relVol || '');
    const obsThere = /obsbot/i.test(rel);
    const addP = (key, w, why) => out.items.push({ key, w, why, prod: PROD[key] });

    if (c.lines.console) addP('Tail 2', 80, `相关产品线含 Livestream Console，Tail 2（导播/直播机位）可直接嵌入其方案包`);
    if (c.lines.ptz) addP('Tail 2', c.sku.ptzSku ? 84 : 72, `已代理 PTZ Camera 产品线${c.sku.ptzSku ? `（${c.sku.ptzSku} SKU 竞品）` : ''}，Tail 2 是 OBSBOT 在该线的主力`);
    if (c.lines.webcam) addP('Meet 2', 70, `Webcam 为其在售产品线，Meet 2 覆盖会议/远程办公标准位`);
    if (c.lines.webcam) addP('Tiny 3 Lite', 62, `Webcam 线需要入门价位补位，Tiny 3 Lite 对位 Logitech Brio 500 段`);
    if (obsThere) addP('Tiny 3', 76, `相关产品线体量显示 OBSBOT 已进入，建议补 Tiny 3 拉高客单`);
    if (c.directComp && /logitech|aver|poly/i.test(c.compRaw)) {
      out.items.forEach((it) => { it.why += '；其已代理 Logitech/AVer 等直接竞品，需以差异化 AI 追踪切入'; });
    }

    // 去重，按权重
    const seen = {};
    out.items = out.items.filter((it) => (seen[it.key] ? false : (seen[it.key] = true))).sort((a, b) => b.w - a.w).slice(0, 3);
    if (!out.items.length) {
      out.items.push({ key: 'Meet 2', w: 40, why: '相关产品线记录不完整，建议先以 Meet 2 试探其会议品类需求', prod: PROD['Meet 2'] });
    }
    out.level = out.items[0].w >= 78 ? '高' : out.items[0].w >= 62 ? '中' : '低';
    out.headline = `主推 ${out.items.map((i) => i.key).join(' + ')}`;
    return out;
  }

  /* 零售商行动建议（供「下一步动作」列与详情抽屉） */
  const P_ACTION = {
    P1: { coop: '高层对焦·锁排面', open: '破冰：总部买手直连' },
    P2: { coop: '扩品类目·冲主推位', open: '建联后推竞品对标' },
    P3: { coop: '维持基本覆盖', open: '低成本触达 / 观察' },
  };
  function retailerAction(c) {
    const base = P_ACTION[c.p || 'P3'];
    if (c.coop === '已合作') return base.coop;
    if (c.contact === '是') return '已建联 · ' + (c.p === 'P1' ? '争取首单' : '提交报价');
    return base.open;
  }

  /* ---------- 构建 ---------- */
  /* 新增客户（名单阶段）：表里只有 国家 / 客户名 / 优先级 / 简介 / 官网 / 覆盖区域 / 是否建联，
     体量、竞品、产品线全没调研过。所以：
       · 保留原表给的 P 码与简介，别的一律不推断；
       · 不跑 P 码三因子判定（空数据算出来的是假结论，还会在「判定与校准」页刷出一片"不一致"）；
       · 不给主推型号（同理），改用「名单阶段」明确说明；
       · 负责人默认 Evelyn（这批统一由她跟）。 */
  function markLead(c, key, i) {
    const from = NEW_FROM[key];
    c.batch = from != null && i >= from ? 'new' : 'base';
    if (c.batch !== 'new') return c;
    c.lead = true;
    c.ownerDefault = 'Evelyn';
    c.judge = null;
    c.pModel = null;
    c.pConflict = false;
    c.advice = {
      items: [], gaps: [], basis: [], level: '未知',
      headline: '名单阶段：体量 / 竞品 / 产品线均未调研，暂不做型号预判',
    };
    c.action = '名单阶段 · 先补官网与产品线调研';
    return c;
  }

  function build() {
    APP.retailers = S1.rows.map((r, i) => markLead(buildRetailer(r, i), 'retailer', i)).filter((c) => c.name);
    APP.agents = S2.rows.map((r, i) => markLead(buildAgent(r, i), 'agent', i)).filter((c) => c.name);
    APP.retailers.forEach((c) => { if (c.batch !== 'new') c.action = retailerAction(c); });
    APP.agents.forEach((c) => {
      if (c.batch === 'new') return;
