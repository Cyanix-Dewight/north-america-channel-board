  function contactChip(c) {
    const m = { 是: 'blue', 否: 'low', 待核实: 'na' };
    const t = { 是: '已建联', 否: '未建联', 待核实: '待核实' };
    return `<span class="chip ${m[c.contact]}">${t[c.contact]}</span>`;
  }
  function tierDot(t) {
    if (!t) return '<span class="mini muted">未量化</span>';
    return `<span class="chip plain" style="border-left:3px solid ${t.color}">${t.key}</span>`;
  }
  function scaleCell(c) {
    if (!c.mny) return '<span class="mini muted">未量化</span>';
    const cad = c.mny.cur === 'CAD' ? `<span class="mini" style="color:#0E7490;margin-left:3px" title="原表为加元，已按 0.73 折算">CAD</span>` : '';
    return `<span style="font-variant-numeric:tabular-nums">${moneyRangeShort(c.mny.low, c.mny.high)}</span>${cad}`;
  }
  function prodChips(items, max) {
    if (!items || !items.length) return '<span class="mini muted">—</span>';
    return items.slice(0, max || 3).map((i) => `<span class="chip teal" style="margin:1px 2px 1px 0;font-size:10px">${esc(i.key || i)}</span>`).join('');
  }

  /* ---------- 过滤 / 排序 ---------- */
  APP.filtered = function () {
    const f = state.filters;
    return LIST().filter((c) => {
      if (f.country !== 'ALL' && c.country !== f.country) return false;
      if (f.p !== 'ALL' && c.p !== f.p) return false;
      if (f.coop !== 'ALL' && c.coop !== f.coop) return false;
      if (f.contact !== 'ALL' && c.contact !== f.contact) return false;
      if (f.level !== 'ALL' && (c.advice ? c.advice.level : '') !== f.level) return false;
      if (f.q) {
        const hay = [c.name, c.intro, c.coverage, c.note, c.scaleText, c.compRaw, c.mainCats, c.linesRaw].join(' ').toLowerCase();
        if (hay.indexOf(f.q.toLowerCase()) < 0) return false;
      }
      return true;
    });
  };

  const P_ORDER = { P1: 0, P2: 1, P3: 2 };
  function sortList(list) {
    const arr = list.slice();
    const k = state.sort.key, dir = state.sort.dir === 'asc' ? 1 : -1;
    const tie = (a, b) => (b.scaleMid || 0) - (a.scaleMid || 0); // 同档内按体量降序
    arr.sort((a, b) => {
      let va, vb;
      switch (k) {
        case 'p':
          if (P_ORDER[a.p] !== P_ORDER[b.p]) return P_ORDER[a.p] - P_ORDER[b.p];
          return tie(a, b);
        case 'name': va = a.name; vb = b.name; break;
        case 'scale': va = a.scaleMid; vb = b.scaleMid; break;
        case 'sku': va = a.sku.totalSku; vb = b.sku.totalSku; break;
        case 'obs': va = a.sku.obs ? a.sku.obs.sku : -1; vb = b.sku.obs ? b.sku.obs.sku : -1; break;
        case 'level': va = { 高: 0, 中: 1, 低: 2, 维持: 3, 未知: 4 }[a.advice.level]; vb = { 高: 0, 中: 1, 低: 2, 维持: 3, 未知: 4 }[b.advice.level]; break;
        case 'country': va = a.country; vb = b.country; break;
        case 'coop': va = a.coop; vb = b.coop; break;
        default: va = a.scaleMid; vb = b.scaleMid;
      }
      const na = va == null || va === '' || (typeof va === 'number' && isNaN(va));
      const nb = vb == null || vb === '' || (typeof vb === 'number' && isNaN(vb));
      if (na && nb) return tie(a, b);
      if (na) return 1;
      if (nb) return -1;
      if (typeof va === 'string') { const r = va.localeCompare(vb, 'zh') * dir; return r || tie(a, b); }
      return (va - vb) * dir;
    });
    return arr;
  }

  /* ---------- 总览 ---------- */
  function renderOverview(list) {
    const all = LIST();
    const n = list.length;
    const p1 = list.filter((c) => c.p === 'P1').length;
    const p2 = list.filter((c) => c.p === 'P2').length;
    const p3 = list.filter((c) => c.p === 'P3').length;
    const coop = list.filter((c) => c.coop === '已合作').length;
    const coopKnown = list.filter((c) => c.coop !== '待核实').length;
    const contact = list.filter((c) => c.contact === '是').length;
    const quant = list.filter((c) => c.mny).length;
    const mids = list.filter((c) => c.scaleMid).map((c) => c.scaleMid).sort((a, b) => a - b);
    const median = mids.length ? mids[Math.floor(mids.length / 2)] : null;
    const totalSku = list.reduce((a, c) => a + c.sku.totalSku, 0);
    const obsShelf = list.filter((c) => c.sku.obs && c.sku.obs.sku > 0).length;
    const hiOpp = list.filter((c) => c.advice.level === '高').length;

    /* 国家不再只认 US / CA：新增名单里有 PR（波多黎各）和空值，
       写死两个键会让饼图合计小于总数、P 码分布也漏人 */
    const countryMap = {};
    list.forEach((c) => { const k = (c.country || '').toUpperCase(); countryMap[k] = (countryMap[k] || 0) + 1; });
    const C_COLOR = { US: C.brand, CA: C.teal, PR: C.p2, MX: C.p1, '': '#CBD5E1' };
    const cKeys = Object.keys(countryMap).sort((a, b) => countryMap[b] - countryMap[a]);
    const cName = (k) => {
      const base = countryLabel({ country: k });
      return k ? `${base} ${k}` : base;
    };
    const cColor = (k) => C_COLOR[k] || C.p3;
    const pByCountry = cKeys.slice(0, 4).map((k) => ({
      name: countryLabel({ country: k }),
      color: cColor(k),
      data: ['P1', 'P2', 'P3'].map((p) => list.filter((c) => (c.country || '').toUpperCase() === k && c.p === p).length),
    }));

    const top = list.slice().sort((a, b) => (b.scaleMid || 0) - (a.scaleMid || 0)).slice(0, 12);
    const barItems = top.map((c) => ({
      label: c.name, value: c.scaleMid,
      color: c.mny && c.mny.cur === 'CAD' ? C.teal : C.brand,
      text: c.scaleMid ? moneyRangeShort(c.mny.low, c.mny.high) : '未量化',
    }));

    const tierCount = {};
    list.forEach((c) => { const t = c.tier ? c.tier.key : 'N'; tierCount[t] = (tierCount[t] || 0) + 1; });
    const tierItems = SCALE_TIERS.map((t) => ({ label: t.label, value: tierCount[t.key] || 0, color: t.color }))
      .concat([{ label: 'N · 未量化（定性描述）', value: tierCount.N || 0, color: '#CBD5E1' }]);

    const stage = [
      { label: '客户池', value: n },
      { label: '已建联', value: contact, rate: pctf(contact, n) + '%' },
      { label: '已合作', value: coop, rate: pctf(coop, n) + '%' },
    ];

    const insights = buildInsights(list);

    return `
    <div class="grid g-kpi" style="margin-bottom:14px">
      ${kpi(TITLE_WORD + '总数', n, all.length !== n ? `全量 ${all.length} · 当前为筛选结果` : '全部纳入 P 码分级', 'accent')}
      ${kpi('P1', p1, `占比 ${pctf(p1, n)}% · 优先投入`, p1 ? 'alert' : '')}
      ${kpi('P2', p2, `占比 ${pctf(p2, n)}% · 稳定跟进`)}
      ${kpi('P3', p3, `占比 ${pctf(p3, n)}% · 观察维护`)}
      ${kpi('已合作', coop, `合作率 ${pctf(coop, coopKnown)}%（分母：状态已知 ${coopKnown}）`)}
      ${kpi('已建联', contact, `建联率 ${pctf(contact, n)}%`)}
      ${kpi('体量可量化', quant + '<small>/' + n + '</small>', `中位 ${median ? money(median) : '—'}`)}
      ${kpi('竞品 SKU 记录', totalSku.toLocaleString(), `OBSBOT 已在架 ${obsShelf} 家`)}
    </div>

    ${leadBanner(list)}

    <div class="grid g-2" style="margin-bottom:14px">
      ${card('综合体量 Top 12 <span class="mini muted">（对数刻度 · 已统一折美元）</span>', '', logBar(barItems), '')}
      ${card('体量分档', '按美元年营收中值', donut(tierItems, { centerLabel: TITLE_WORD, size: 170 }))}
    </div>

    <div class="grid g-2" style="margin-bottom:14px">
      ${card('P 码 × 国家', '看优先级的地理分布', groupedBars(pByCountry, ['P1', 'P2', 'P3'], { height: 180 }))}
      ${card('客户国家分布', cKeys.length > 2 ? '含非美加地区 / 未标注' : '', donut(
        cKeys.map((k) => ({ label: cName(k), value: countryMap[k], color: cColor(k) })),
        { centerLabel: '客户数', size: 170 }))}
    </div>

    <div class="grid g-2" style="margin-bottom:14px">
      ${card('推进阶段', '未填写 ≠ 未合作', funnel(stage))}
      ${card('本期判断', '由数据自动生成', `<ul class="rulelist" style="padding-left:18px">${insights.map((t) => `<li>${t}</li>`).join('')}</ul>`)}
    </div>

    ${IS_R ? '' : ''}`;
  }

  /* 总览顶部的批次说明：新增名单进来后，合计数字会变，这里讲清是谁把数字撑大的 */
  function leadBanner(list) {
    const leads = list.filter((c) => c.batch === 'new').length;
    const base = list.length - leads;
    if (!leads) return '';
    return `<div class="note" style="margin-bottom:14px">
      本页合计 <b>${list.length}</b> 家 = 原表已调研 <b>${base}</b> 家 + 新增名单 <b>${leads}</b> 家。
      新增的这批只带国家 / 客户名 / 优先级 / 简介 / 官网，<b>体量、竞品、门店、产品线都没调研</b>，
      所以在「体量可量化」「竞品 SKU」这类指标里不计入分母；它们的主要用途是「开发跟进」页的推进管理。</div>`;
  }

  function buildInsights(list) {
    const out = [];
    const n = list.length;
    const p1 = list.filter((c) => c.p === 'P1');
    const p1NoCoop = p1.filter((c) => c.coop !== '已合作');
    out.push(`${n} 家${TITLE_WORD}中 <b>P1 ${p1.length}</b> 家、P2 ${list.filter((c) => c.p === 'P2').length} 家、P3 ${list.filter((c) => c.p === 'P3').length} 家；P1 中已有 ${p1.length - p1NoCoop.length} 家合作、<b>${p1NoCoop.length} 家待破冰</b>。`);
    const cadN = list.filter((c) => c.mny && c.mny.cur === 'CAD').length;
    if (cadN) out.push(`<b>${cadN}</b> 家客户原表金额为加元，已按 1 CAD ≈ 0.73 USD 折算后再参与对比（体量分析页可看折算前后）。`);
    const noM = list.filter((c) => !c.mny).length;
    if (noM) out.push(`<b>${noM}</b> 家只有定性体量描述、无金额，图中以「未量化」标出，<b>不按 0 处理</b>。`);
    if (IS_R) {
      const insta = list.filter((c) => c.sku.instaSku >= 3);
      if (insta.length) out.push(`<b>${insta.length}</b> 家已上 Insta360 3 款以上，AI 云台追踪心智已被验证，是 Tiny 3 系列最快的切入点。`);
      const gaps = list.filter((c) => c.advice.gaps && c.advice.gaps.length);
      if (gaps.length) out.push(`<b>${gaps.length}</b> 家存在 $129–199 或 $549+ 的价格带空档，可直接用 Tiny 3 Lite / Tail 2 落位。`);
    } else {
      const judged = list.filter((c) => c.pSource === '模型判定').length;
      const conflict = list.filter((c) => c.pConflict).length;
      if (judged) out.push(`其中 <b>${judged}</b> 家原表未标优先级，由「品类契合 × 渠道体量 × 推进阶段」三因子模型判定，判定依据可在客户详情查看。`);
      else if (conflict) out.push(`用三因子模型回算 ${list.length} 家，<b>${conflict}</b> 家与你的原表判定不一致（多为「品类深但体量小」或「体量大但摄像非核心品类」）。看板以原表为准，不一致清单在「P 码判定与校准」页。`);
    }
    return out;
  }

  /* ---------- P 码总表 ---------- */
  function renderBoard(list) {
    const rows = sortList(list);
    const groups = { P1: [], P2: [], P3: [] };
    rows.forEach((c) => (groups[c.p] ? groups[c.p].push(c) : null));
    const sum = (arr) => arr.reduce((a, c) => a + (c.scaleMid || 0), 0);
    const head = IS_R
      ? ['#', '客户', '国家', '优先级', '综合体量 (USD)', '门店', '竞品 SKU', 'OBSBOT', '竞品深度', '建议动作', '主推产品']
      : ['#', '客户', '国家', '优先级', '综合体量 (USD)', '渠道角色', '竞品 SKU', 'OBSBOT', '产品线', '建议动作', '主推产品'];

    const body = rows.map((c, i) => {
      const mid = IS_R
        ? `${c.store.n == null ? '<span class="mini muted">—</span>' : (c.store.approx ? '≈' : '') + c.store.n.toLocaleString()}`
        : `<span class="mini">${esc((c.judge ? c.judge.chLabel : '') || '—')}</span>`;
      const depth = IS_R
        ? `<div class="cbar" style="min-width:86px"><span class="val" style="min-width:30px">${c.sku.totalSku || '—'}</span><div class="mbar" style="flex:1"><i style="width:${Math.min(100, (c.sku.totalSku / 300) * 100)}%;background:${c.sku.totalSku >= 100 ? C.brand : c.sku.totalSku >= 30 ? C.teal : C.gray}"></i></div></div>`
        : `<span class="mini">${esc((c.linesRaw || '').replace(/\n/g, ' / ').slice(0, 34) || '—')}</span>`;
      return `<tr data-id="${c.id}">
        <td class="muted num">${i + 1}</td>
        <td><div class="tname">${esc(c.name)}${leadChip(c)}</div><div class="mini">${esc((c.intro || '').slice(0, 34))}${(c.intro || '').length > 34 ? '…' : ''}</div></td>
        <td>${countryLabel(c)}</td>
        <td>${pChip(c, true)}</td>
        <td>${scaleCell(c)} ${tierDot(c.tier)}</td>
        <td>${mid}</td>
        <td class="num">${c.sku.totalSku || '<span class="mini muted">—</span>'}</td>
        <td>${c.sku.obs && c.sku.obs.sku ? `<span class="chip blue">${c.sku.obs.sku}</span>` : '<span class="mini muted">未在架</span>'}</td>
        <td>${depth}</td>
        <td class="mini">${esc(c.action || '')}</td>
        <td>${prodChips(c.advice.items, 2)}</td>
      </tr>`;
    }).join('');

    const groupCards = ['P1', 'P2', 'P3'].map((p) => {
      const arr = groups[p];
      const avg = arr.length && sum(arr) ? sum(arr) / arr.filter((c) => c.scaleMid).length : null;
      const cls = { P1: 'alert', P2: '', P3: '' }[p];
      return `<div class="kpi ${cls}">
        <div class="k">${p} · ${{ P1: '优先投入', P2: '稳定跟进', P3: '观察维护' }[p]}</div>
        <div class="v">${arr.length}<small>家</small></div>
        <div class="d">已合作 ${arr.filter((c) => c.coop === '已合作').length} · 已建联 ${arr.filter((c) => c.contact === '是').length} · 平均体量 ${avg ? money(avg) : '—'}</div>
      </div>`;
    }).join('');

    return `
    <div class="grid g-3" style="margin-bottom:14px">${groupCards}</div>
    <div class="card">
      <div class="card-h"><h3>${TITLE_WORD} P 码总表</h3>
        <span class="hint">按 P 码 → 体量降序 · 点击任意行查看完整字段与判断依据</span>
        <div class="right">
          ${IS_R ? '' : '<span class="chip na">P 码取原表；标「· 模型 Px」者为模型复算结果，仅供参考</span>'}
          <button class="btn sm" data-act="export-csv">导出 CSV</button>
        </div></div>
      <div class="card-b" style="padding-top:8px">
        <div class="tablewrap" style="max-height:calc(100vh - 300px)"><table class="dt">
          <thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${body}</tbody>
        </table></div>
      </div>
    </div>`;
  }

  /* ---------- 体量分析 ---------- */
  function renderScale(list) {
    const sorted = list.slice().filter((c) => c.scaleMid).sort((a, b) => b.scaleMid - a.scaleMid);
    const topN = state.scaleTop;
    const shown = topN === 0 ? sorted : sorted.slice(0, topN);
    const bars = shown.map((c) => ({
      label: c.name, value: c.scaleMid,
      color: c.mny.cur === 'CAD' ? C.teal : C.brand,
      text: moneyRangeShort(c.mny.low, c.mny.high),
    }));

    const cadList = list.filter((c) => c.mny && c.mny.cur === 'CAD').sort((a, b) => b.scaleMid - a.scaleMid);
    const locAmt = (v) => (v >= 1e8 ? (Math.round(v / 1e8 * 10) / 10) + ' 亿' : Math.round(v / 1e4) + ' 万');
    const cadRows = cadList.map((c) => {
      const lo = c.mny.lowLocal, hi = c.mny.highLocal;
      const same = lo >= 1e8 && hi >= 1e8;
      const txtLocal = same
        ? `${Math.round(lo / 1e8 * 10) / 10}–${Math.round(hi / 1e8 * 10) / 10} 亿加元`
        : `${locAmt(lo)} – ${locAmt(hi)} 加元`;
      return `<tr data-id="${c.id}">
        <td>${esc(c.name)}</td>
        <td class="num">${txtLocal}</td>
        <td class="num">${moneyRangeShort(c.mny.low, c.mny.high)}</td>
        <td class="num mini">−27%</td>
        <td>${tierDot(c.tier)}</td>
      </tr>`;
    }).join('');

    const noM = list.filter((c) => !c.mny);
    const odd = list.filter((c) => c.mny && c.mny.odd);

    const tierCount = {};
    list.forEach((c) => { const t = c.tier ? c.tier.key : 'N'; tierCount[t] = (tierCount[t] || 0) + 1; });
    const tierItems = SCALE_TIERS.map((t) => ({ label: t.label, value: tierCount[t.key] || 0, color: t.color }))
      .concat([{ label: 'N · 未量化', value: tierCount.N || 0, color: '#CBD5E1' }]);

    // 散点：体量 × 竞品 SKU 深度（零售商）/ 体量 × 产品线数（代理）
    const pts = list.filter((c) => c.scaleMid).map((c) => ({
      x: c.scaleMid,
      y: IS_R ? (c.sku.totalSku || 0) : (c.judge ? c.judge.factors[0].v : 50),
      label: c.name,
      color: { P1: C.p1, P2: C.p2, P3: C.p3 }[c.p] || C.gray,
      r: c.p === 'P1' ? 5.4 : 4.2,
      tip: `${moneyRange(c.mny.low, c.mny.high)} · ${IS_R ? '竞品 SKU ' + c.sku.totalSku : '品类契合 ' + c.judge.factors[0].v}`,
    }));
    const sc = scatter(pts, {
      height: 320, xLog: true,
      xTicks: [{ v: 1e6, label: '$1M' }, { v: 1e8, label: '$100M' }, { v: 1e10, label: '$10B' }, { v: 1e11, label: '$100B' }],
      yTicks: IS_R ? [{ v: 0, label: '0' }, { v: 100, label: '100' }, { v: 200, label: '200' }, { v: 300, label: '300' }] : [{ v: 0, label: '0' }, { v: 50, label: '50' }, { v: 100, label: '100' }],
      xLabel: '年营收中值（USD · 对数）',
      yLabel: IS_R ? '竞品 SKU 总数' : '品类契合分',
    });

    return `
    <div class="grid g-kpi" style="margin-bottom:14px">
      ${kpi('可量化客户', list.filter((c) => c.mny).length + '<small>/' + list.length + '</small>', '有明确金额描述')}
      ${kpi('加元客户', cadList.length, '已按 0.73 折美元')}
      ${kpi('未量化', noM.length, '只有定性描述')}
      ${kpi('区间跨度异常', odd.length, '首尾相差 >20 倍，建议复核原表', odd.length ? 'alert' : '')}
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-h"><h3>综合体量排行 · 统一美元口径</h3>
        <span class="hint">对数横轴，跨度从百万到千亿也能同图对比；青色 = 原表为加元</span>
        <div class="right">
          <select id="sc-top"><option value="20"${topN === 20 ? ' selected' : ''}>前 20</option>
          <option value="40"${topN === 40 ? ' selected' : ''}>前 40</option>
          <option value="0"${topN === 0 ? ' selected' : ''}>全部</option></select>
        </div></div>
      <div class="card-b">${bars.length ? logBar(bars) : '<div class="empty">当前筛选下没有可量化的体量数据</div>'}</div>
    </div>

    <div class="grid g-2" style="margin-bottom:14px">
      ${card('体量 × ' + (IS_R ? '竞品 SKU 深度' : '品类契合分'), '点的颜色 = P 码', sc)}
      ${card('体量分档分布', '', donut(tierItems, { centerLabel: '客户数', size: 170 }))}
    </div>

    ${cadList.length ? card('加元 → 美元折算明细', `共 ${cadList.length} 家·汇率 1 CAD = 0.73 USD`, `
      <div class="tablewrap" style="max-height:340px"><table class="dt">
        <thead><tr><th>客户</th><th class="num">原表（加元）</th><th class="num">折算后（美元）</th><th class="num">折减</th><th>分档</th></tr></thead>
        <tbody>${cadRows}</tbody></table></div>`, '', '') : ''}

    ${(noM.length || odd.length) ? `<div class="card" style="margin-top:14px"><div class="card-h"><h3>数据质量提示</h3><span class="hint">这些记录未被强行填数，仅在此提示</span></div>
      <div class="card-b">
        ${noM.length ? `<div class="mini muted" style="margin-bottom:6px">只有定性描述、无金额（${noM.length} 家）→ 图中标「未量化」，不参与排序</div>
        <div class="miswrap" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">${noM.map((c) => `<span class="chip plain" data-id="${c.id}" style="cursor:pointer">${esc(c.name)}</span>`).join('')}</div>` : ''}
        ${odd.length ? `<div class="mini muted" style="margin-bottom:6px">金额区间跨度异常（${odd.length} 家）→ 大概率原表输入有误，建议复核</div>
        ${odd.map((c) => `<div class="dimrow" style="grid-template-columns:1fr 130px"><div><div class="dn">${esc(c.name)}</div><div class="ev">${esc(c.scaleText.slice(0, 80))}</div></div><div class="sc" style="font-size:11.5px">${moneyRange(c.mny.low, c.mny.high)}</div></div>`).join('')}` : ''}
      </div></div>` : ''}
    `;
  }

  /* ---------- 客户主表 ---------- */
  const EX_COLS_R = [
    { key: 'name', label: '客户', sort: 'name' },
    { key: 'country', label: '国家', sort: 'country' },
    { key: 'p', label: '优先级', sort: 'p' },
    { key: 'scale', label: '综合体量', sort: 'scale' },
    { key: 'store', label: '门店', sort: null },
    { key: 'sku', label: '竞品 SKU', sort: 'sku' },
    { key: 'obs', label: 'OBSBOT 在架', sort: 'obs' },
    { key: 'coop', label: '合作', sort: 'coop' },
    { key: 'contact', label: '建联', sort: null },
    { key: 'opp', label: '入驻机会', sort: 'level' },
    { key: 'action', label: '下一步动作', sort: null },
  ];
  const EX_COLS_A = [
    { key: 'name', label: '客户', sort: 'name' },
    { key: 'country', label: '国家', sort: 'country' },
    { key: 'p', label: '优先级', sort: 'p' },
    { key: 'scale', label: '综合体量', sort: 'scale' },
    { key: 'ch', label: '渠道性质', sort: null },
    { key: 'lines', label: '相关产品线', sort: null },
    { key: 'coop', label: '合作', sort: 'coop' },
    { key: 'contact', label: '建联', sort: null },
    { key: 'opp', label: '主推', sort: 'level' },
    { key: 'action', label: '下一步动作', sort: null },
  ];
  /* 新增客户（名单阶段）标记：把「调研过的原表客户」和「刚进池子的名单」区分开，
     免得有人拿只有简介和 P 码的名单去和做过体量/竞品调研的客户直接比。 */
  function leadChip(c) {
    return c && c.batch === 'new'
      ? '<span class="chip lead" title="新增客户：只有国家 / 客户名 / 优先级 / 简介 / 官网，体量与竞品待补研">新增 · 名单</span>'
      : '';
  }

  /* 客户名字元：名字 + 右侧「新标签打开官网」小图标，下方显示域名。
     图标是 <a>，不走行点击 → main 表里点它跳官网、点其它地方开抽屉。 */
  function nameCell(c) {
    const site = siteUrl(c.url), host = siteHost(c.url);
    return `<td><div class="tname">${esc(c.name)}${leadChip(c)}${
      site ? `<a class="sitego" href="${esc(site)}" target="_blank" rel="noopener noreferrer" title="在新标签页打开官网：${esc(site)}" aria-label="打开官网">↗</a>` : ''
    }</div><div class="mini">${host ? esc(host) : '官网待补充'}</div></td>`;
  }

  function renderExplorer(list) {
    const rows = sortList(list);
    const cols = IS_R ? EX_COLS_R : EX_COLS_A;
    const th = (col) => {
      const on = state.sort.key === col.sort;
      if (!col.sort) return `<th>${col.label}</th>`;
      return `<th class="sortable ${on ? 'on' : ''}" data-sort="${col.sort}">${col.label}<span class="sort">${on ? (state.sort.dir === 'desc' ? '▼' : '▲') : '⇅'}</span></th>`;
    };
    const body = rows.map((c) => {
      const cells = IS_R
        ? [
          nameCell(c),
          `<td>${countryLabel(c)}</td>`,
          `<td>${pChip(c, true)}</td>`,
          `<td>${scaleCell(c)}</td>`,
          `<td class="num">${c.store.n == null ? '<span class="mini muted">—</span>' : (c.store.approx ? '≈' : '') + c.store.n.toLocaleString()}</td>`,
          `<td class="num">${c.sku.totalSku || '<span class="mini muted">—</span>'}</td>`,
          `<td>${c.sku.obs && c.sku.obs.sku ? `<span class="chip blue">${c.sku.obs.sku} SKU</span>` : '<span class="mini muted">未在架</span>'}</td>`,
          `<td>${coopChip(c)}</td>`,
          `<td>${contactChip(c)}</td>`,
          `<td>${levelChip(c.advice.level)}</td>`,
          `<td class="mini">${esc(c.action || '')}</td>`,
        ]
        : [
          nameCell(c),
          `<td>${countryLabel(c)}</td>`,
          `<td>${pChip(c, true)}</td>`,
          `<td>${scaleCell(c)}</td>`,
          `<td><span class="mini">${esc(c.judge ? c.judge.chLabel : '—')}</span></td>`,
          `<td><span class="mini">${esc((c.linesRaw || '').replace(/\n/g, ' · ').slice(0, 30) || '—')}</span></td>`,
          `<td>${coopChip(c)}</td>`,
          `<td>${contactChip(c)}</td>`,
          `<td>${prodChips(c.advice.items, 2)}</td>`,
          `<td class="mini">${esc(c.action || '')}</td>`,
        ];
      return `<tr data-id="${c.id}">${cells.join('')}</tr>`;
    }).join('');

    return `
    <div class="card">
      <div class="card-h"><h3>${TITLE_WORD}主表</h3><span class="hint">共 ${rows.length} 条 · 点任意行看完整原始字段、判断依据与入驻预判</span>
        <div class="right"><button class="btn sm" data-act="export-csv">导出当前表 CSV</button></div></div>
      <div class="card-b" style="padding-top:8px">
        <div class="tablewrap"><table class="dt"><thead><tr>${cols.map(th).join('')}</tr></thead><tbody>${body}</tbody></table></div>
      </div></div>`;
  }

  /* ---------- 抽屉 ---------- */
  function openDrawer(id) {
    const c = LIST().find((x) => x.id === id) || APP.customers.find((x) => x.id === id);
    if (!c) return;
    const box = el('drawer');
    const site = siteUrl(c.url), host = siteHost(c.url);
    const sm = c.sku;
    const skuRows = sm.list.slice(0, 12).map((b) => `<div class="dimrow" style="grid-template-columns:1fr 96px">
        <div><div class="dn">${esc(b.brand)}${/obsbot/i.test(b.brand) ? ' <span class="chip blue" style="font-size:9px">我方</span>' : ''}</div>
        <div class="ev">价格带 ${b.lo != null ? '$' + b.lo + '–' + b.hi : '未记录'}</div></div>
        <div class="sc" style="font-size:12px">${b.sku || '—'} SKU</div></div>`).join('') || '<div class="mini muted">原表未记录竞品 SKU 结构</div>';

    const advRows = (c.advice.items || []).map((i) => `<div class="dimrow" style="grid-template-columns:1fr 40px">
        <div><div class="dn">${esc(i.key)} <span class="mini muted">$${i.prod.lo}–${i.prod.hi} · ${i.prod.role}</span></div>
        <div class="ev">${esc(i.why)}</div></div>
        <div class="sc" style="font-size:11px;color:${C.brand}">${i.w}</div></div>`).join('');

    const judgeRows = c.judge ? c.judge.factors.map((f, i) => `<div class="dimrow" style="grid-template-columns:1fr 40px">
        <div><div class="dn">${['品类契合', '渠道体量', '推进阶段'][i]}</div><div class="ev">${esc(f.why)}</div></div>
        <div class="sc">${f.v}</div></div>`).join('') : '';

    const rawRows = Object.entries(c.raw || {}).map(([k, v]) => {
      let show;
      if (v === null || v === '') show = '<span class="mini muted">空</span>';
      else if (k === '官网' && site) show = `<a href="${esc(site)}" target="_blank" rel="noopener noreferrer">${esc(v)} ↗</a>`;
      else show = esc(v);
      return `<dt>${esc(k)}</dt><dd>${show}</dd>`;
    }).join('');

    const ladder = (IS_R && sm.lines.webcam.length) ? priceLadder(
      sm.lines.webcam.slice(0, 8).map((x) => ({ brand: x.brand, sku: x.sku, lo: x.lo, hi: x.hi })),
      { marks: (c.advice.items || []).map((i) => ({ name: i.key, lo: i.prod.lo, hi: i.prod.hi })) }
    ) : '';

    box.innerHTML = `
      <div class="drawer-h">
        <div class="top"><div>
          <h2>${esc(c.name)}</h2>
          <div class="sub">${esc(c.typeLabel)} · ${countryLabel(c)} · ${pChip(c, true)} ${coopChip(c)} ${contactChip(c)}${
            c.role ? ` <span class="chip ${c.role.bin === '分销商' ? 'teal' : 'blue'}" title="依据简介原句：${esc(c.role.why)}">${esc(c.role.sub)}</span>` : ''} ${leadChip(c)}</div>
          ${site
            ? `<a class="sitelink" href="${esc(site)}" target="_blank" rel="noopener noreferrer" title="在新标签页打开：${esc(site)}"><b>打开官网</b><span class="u">${esc(host)}</span><span class="arw">↗</span></a>`
            : '<div class="sitelink na" title="原表「官网」列为空或不是有效网址">官网待补充</div>'}
        </div><button class="xbtn" data-act="close-drawer">×</button></div>
      </div>
      <div class="drawer-b">
        <div class="sect"><h4>综合体量（统一美元）</h4>
          <div class="kv">
            <dt>金额区间</dt><dd>${c.mny ? moneyRange(c.mny.low, c.mny.high) : '未量化（原表仅定性描述）'}</dd>
            <dt>口径</dt><dd>${c.mny ? esc(c.mny.via) + (c.mny.approx ? ' · 原文为「数…」等约数' : '') : '—'}</dd>
            <dt>分档</dt><dd>${c.tier ? c.tier.label : '未分档'}</dd>
          </div>
          <div class="rawbox" style="margin-top:8px">${esc(c.scaleText || '（空）')}</div>
        </div>

        ${judgeRows ? `<div class="sect"><h4>P 码判定依据${c.pSource === '模型判定' ? '（模型判定）' : '（原表标注）'}</h4>
          ${c.pSource === '模型判定' ? `<div class="note" style="margin-bottom:8px">原表未填优先级，此处为模型判定：<b>${c.pModel}</b>。${esc(c.judge.why)}（置信度：${esc(c.judge.conf)}）</div>`
            : (c.pConflict ? `<div class="note warn" style="margin-bottom:8px">原表标 <b>${c.p}</b>，模型建议 <b>${c.pModel}</b>，两者不一致；看板以<b>原表为准</b>，模型结果仅供参考。</div>` : '')}
          ${judgeRows}</div>` : ''}

        ${IS_R ? `<div class="sect"><h4>入驻预判</h4>
          <div class="note" style="margin-bottom:8px"><b>${esc(c.advice.headline)}</b>${(c.advice.basis || []).length ? '<br>' + c.advice.basis.map((b) => esc(b)).join('<br>') : ''}</div>
          ${advRows || '<div class="mini muted">暂无型号建议</div>'}
        </div>` : `<div class="sect"><h4>主推产品线</h4>
          <div class="note" style="margin-bottom:8px"><b>${esc(c.advice.headline)}</b></div>${advRows}</div>`}

        ${ladder ? `<div class="sect"><h4>单店价格带分布（蓝条为 OBSBOT 建议落位）</h4>${ladder}</div>` : ''}

        <div class="sect"><h4>竞品 SKU 结构</h4>
          <div class="kv" style="margin-bottom:8px">
            <dt>Webcam</dt><dd>${sm.webcamSku || (sm.unsplit ? '未分线 ' + sm.unsplitSku : 0)} SKU ${sm.webcamSpan.lo != null ? `（$${sm.webcamSpan.lo}–${sm.webcamSpan.hi}）` : ''}</dd>
            <dt>PTZ</dt><dd>${sm.ptzSku} SKU ${sm.ptzSpan.lo != null ? `（$${sm.ptzSpan.lo}–${sm.ptzSpan.hi}）` : ''}</dd>
            <dt>品牌数</dt><dd>${sm.brandCount}</dd>
            <dt>OBSBOT</dt><dd>${sm.obs ? `${sm.obs.sku} SKU（$${sm.obs.lo}–${sm.obs.hi}）` : '未在架'}</dd>

    box.classList.add('on');
    el('scrim').classList.add('on');
    bindDrawerClicks(box);
  }
  function bindDrawerClicks(box) {
    $$('[data-act="close-drawer"]', box).forEach((b) => b.addEventListener('click', closeDrawer));
  }
  function closeDrawer() {
    el('drawer').classList.remove('on');
    el('scrim').classList.remove('on');
  }

  /* ---------- 导出 ---------- */
  function csvCell(v) { return `"${String(v == null ? '' : v).replace(/"/g, '""')}"`; }
  function download(name, text) {
    const blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  function exportCSV() {
    const list = sortList(APP.filtered());
    const head = ['客户名称', '类型', '国家', '优先级', '优先级来源', '模型建议', '综合体量下限USD', '综合体量上限USD', '体量分档', '币种原值',
      IS_R ? '门店数量' : '覆盖区域', IS_R ? '是否在售webcam' : '相关产品线', '竞品SKU总数', '竞品品牌数', 'OBSBOT在架SKU',
      '是否合作', '是否建联', '入驻机会', '主推产品', '建议动作', '一句话简介'];
    const lines = [head.map(csvCell).join(',')];
    list.forEach((c) => {
      lines.push([
        c.name, c.typeLabel, c.country, c.p, c.pSource, c.pModel || '',
        c.mny ? Math.round(c.mny.low) : '', c.mny ? Math.round(c.mny.high) : '', c.tier ? c.tier.key : '',
        c.mny ? c.mny.cur : '未量化',
        IS_R ? (c.store.n == null ? '' : c.store.n) : c.coverage,
        IS_R ? c.webcamOn : c.linesRaw.replace(/\n/g, ' / '),
        c.sku.totalSku, c.sku.brandCount, c.sku.obs ? c.sku.obs.sku : 0,
        c.coop, c.contact, c.advice.level, (c.advice.items || []).map((i) => i.key).join(' / '),
        c.action, c.intro,
      ].map(csvCell).join(','));
    });
    download(`${TITLE_WORD}渠道看板_${new Date().toISOString().slice(0, 10)}.csv`, lines.join('\r\n'));
  }

  /* ---------- 方法页（共用骨架，profile 差异由 EXTRA 提供） ---------- */
  function renderMethod(list) {
    const n = list.length;
    const rows = W.METHOD_EXTRAS && W.METHOD_EXTRAS[PROFILE] ? W.METHOD_EXTRAS[PROFILE](list) : '';
    return `
    <div class="grid g-2" style="align-items:start;margin-bottom:14px">
      ${card('一、这份看板怎么来的', '', `
        <ul class="rulelist">
          <li>数据源：<code>${esc(APP.meta.source.split('\\').pop() || '北美渠道客户整理 (5).xlsx')}</code> → 「${TITLE_WORD}」工作表 <b>${n}</b> 行，<b>所有原表字段原样保留</b>，未重命名、未删列。</li>
          <li>空值一律保留为空，页面显示「待核实 / 未量化 / —」三态，<b>不填 0、不推测</b>。</li>
          <li>优先级统一为 <b>P1 / P2 / P3</b>。${IS_R ? `零售商 P 码取自原表标注（${n} 家全部已标）。` : `代理集成商 P 码取自原表标注（${n} 家全部已标），模型按三因子复算一遍用于校准，界面标出与原表不一致者，<b>原表标注永远优先</b>。`}</li>
          <li>综合体量：解析原表金额文本 → 统一折美元 → 分 A–E 五档；加元按 <b>1 CAD = 0.73 USD</b> 折算，若原文已自带给美元换算则直接采用原文。</li>
          <li>竞品 SKU：从「${IS_R ? '头部竞品品牌体量' : '合作竞品'}」列解析出「品牌 × SKU 数 × 价格带」，用于 ${IS_R ? 'OBSBOT 产品入驻预判' : '产品线匹配判断'}。</li>
        </ul>`, '', '')}
      ${card('二、体量与货币口径', '', `
        <ul class="rulelist">
          <li>金额单位识别：<code>亿 / 万 / B / M / K</code>，以及「数亿」「数千万」等约数（取中值并标「约」）。</li>
          <li>币种识别：句中含 <code>加元 / CAD</code> → 按加元处理并折算；含 <code>美元 / USD</code> → 直接采用；<b>括号内的换算值优先于主句</b>（作者自己换算过最准）。</li>
          <li>分档按<b>美元年营收中值</b>：A ≥$100 亿 · B $10–100 亿 · C $1–10 亿 · D $1,000万–$1亿 · E &lt;$1,000万。</li>
          <li>跨度超过 20 倍的区间会进「数据质量提示」，不静默处理。</li>
          <li>图上用<b>对数横轴</b>：$200 万到 $6,500 亿在同一张图里也能看清相对位置。</li>
        </ul>
        <div class="note warn" style="margin-top:8px">汇率 0.73 为口径假设，不是实时汇率；如需调整，改 <code>CORE.CAD_RATE</code> 后重新构建即可。</div>`, '', '')}
    </div>
    ${rows}
    <div class="card" style="margin-top:14px"><div class="card-h"><h3>六、页面与交互</h3></div>
      <div class="card-b"><ul class="rulelist">
        <li>左侧筛选栏的「优先级 / 合作 / 建联 / 国家 / 搜索」对<b>所有页面同时生效</b>，切换 tab 不会重置。</li>
        <li>表格任意行可点击 → 右侧抽屉展开：原始字段、体量解析证据、竞品 SKU、产品建议、价格带图。</li>
        <li>表头带 ⇅ 的列可排序；缺失值永远排在最后。</li>
        <li>每页右上角可导出 CSV（含优先级来源与模型建议，便于复核）。</li>
        <li>「开发跟进」页的填写内容<b>不进 Excel</b>：先存本机浏览器，用共享版网址打开时按字段同步到云端，多人同时改不同列不会互相覆盖；改动后表格不会跳回顶部。</li>
        <li>本文件为<b>单文件离线看板</b>，无任何外部依赖，双击即可打开。</li>
      </ul></div></div>`;
  }

  /* ---------- 路由 / 初始化 ---------- */
  const VIEWS = ['overview', 'board', 'scale'];
  function render() {
    const list = APP.filtered();
    const box = el('view-' + state.view);
    if (!box) return;
    let html = '';
    switch (state.view) {
      case 'overview': html = renderOverview(list); break;
      case 'board': html = renderBoard(list); break;
      case 'scale': html = renderScale(list); break;
      case 'explorer': html = renderExplorer(list); break;
      case 'method': html = renderMethod(list); break;
      case 'map': html = W.MAP_VIEW ? W.MAP_VIEW(list) : '<div class="empty">地图模块未加载</div>'; break;
      case 'pipe': html = W.PIPE_VIEW ? W.PIPE_VIEW(list) : '<div class="empty">跟进模块未加载</div>'; break;
      default: {
        const ev = W.EXTRA_VIEWS && W.EXTRA_VIEWS[state.view];
        html = ev ? ev(list) : '<div class="empty">视图未实现</div>';
      }
    }
    box.innerHTML = html;
    $$('.view').forEach((s) => s.classList.toggle('active', s.id === 'view-' + state.view));
    bindView(box);
    $$('.tab').forEach((b) => b.classList.toggle('active', b.dataset.view === state.view));
    syncCounts();
    if (state.view === 'map' && W.MAP_BIND) W.MAP_BIND(list);
    if (state.view === 'pipe' && W.PIPE_BIND) W.PIPE_BIND(box, render);
  }

  function syncCounts() {
    const list = APP.filtered();
    const m = { overview: list.length, board: list.length, scale: list.filter((c) => c.mny).length, explorer: list.length, role: list.length };
    if (W.PIPE && W.PIPE.touched) m.pipe = list.filter((c) => W.PIPE.touched(c)).length;
    $$('.tab').forEach((b) => {
      const n = b.querySelector('.n');
      if (!n) return;
      const v = b.dataset.view;
      n.textContent = m[v] != null ? m[v] : (v === 'map' ? list.length : '');
    });
  }

  function bindView(box) {
    $$('tr[data-id]', box).forEach((tr) => tr.addEventListener('click', (e) => {
      // 行内可编辑控件（开发跟进页）不该触发行点击 → 抽屉弹出
      if (e.target.closest && e.target.closest('input, select, textarea, button, a, label, option')) return;
      openDrawer(tr.dataset.id);
    }));
    $$('.chip[data-id]', box).forEach((ch) => ch.addEventListener('click', () => openDrawer(ch.dataset.id)));
    $$('th[data-sort]', box).forEach((th) => th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (state.sort.key === k) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      else { state.sort.key = k; state.sort.dir = k === 'scale' || k === 'sku' || k === 'obs' ? 'desc' : 'asc'; }
      render();
    }));
    const exp = $('[data-act="export-csv"]', box);
    if (exp) exp.addEventListener('click', exportCSV);
    const top = el('sc-top');
    if (top) top.addEventListener('change', () => { state.scaleTop = Number(top.value); render(); });
    if (W.BIND_EXTRA) W.BIND_EXTRA(box, render);
  }

  function initViewFromHash() {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    const kv = {};
    h.split('&').forEach((p) => { const i = p.indexOf('='); if (i > 0) kv[p.slice(0, i)] = p.slice(i + 1); });
    // 兼容两种格式：#map（旧）与 #t=agent&v=map（总看板带类型）
    const v = kv.v || (h.indexOf('=') < 0 ? h : '');
    if (v && el('view-' + v)) state.view = v;
  }

  function init() {
    initViewFromHash();
    // 总看板：按当前客户类型隐藏不适用的页签；若当前视图属于另一类型则回退总览
    $$('.tab[data-profile]').forEach((b) => {
      const vis = b.dataset.profile === PROFILE;
      b.style.display = vis ? '' : 'none';
      if (!vis && state.view === b.dataset.view) state.view = 'overview';
    });
    if (!el('view-' + state.view)) state.view = 'overview';
    // 总看板：顶部客户类型切换（写 hash 后整页刷新，模块级口径随 Profile 重算）
    $$('.typesw button').forEach((b) => {
      if (b.dataset.t === PROFILE) b.classList.add('on');
      b.addEventListener('click', () => {
        if (b.dataset.t === PROFILE) return;
        location.hash = '#t=' + b.dataset.t + '&v=' + state.view;
        location.reload();
      });
    });
    // 筛选 UI
    const f = state.filters;
    const bindSel = (id, key) => {
      const n = el(id);
      if (!n) return;
      n.value = f[key];
      n.addEventListener('change', () => { f[key] = n.value; render(); });
    };
    // 国家下拉：新增名单里有 PR（波多黎各）和空值，写死「US | CA」会筛不到人 → 按实际数据生成
    const cs = el('f-country');
    if (cs) {
      const seen = {};
      (APP.retailers || []).concat(APP.agents || []).forEach((c) => {
        const k = (c.country || '').toUpperCase(); seen[k] = (seen[k] || 0) + 1;
      });
      const ord = Object.keys(seen).sort((a, b) => seen[b] - seen[a]);
      cs.innerHTML = '<option value="ALL">全部</option>' + ord.map((k) => {
        const nm = countryLabel({ country: k });
        return `<option value="${esc(k)}">${esc(k ? nm + ' ' + k : nm)}</option>`;
      }).join('');
    }
    bindSel('f-country', 'country');
    bindSel('f-p', 'p');
    bindSel('f-coop', 'coop');
    bindSel('f-contact', 'contact');
    bindSel('f-level', 'level');
    const q = el('f-q');
    if (q) {
      let t;
      q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { f.q = q.value; render(); }, 160); });
    }
    const rs = el('f-reset');
    if (rs) rs.addEventListener('click', () => {
      state.filters = { q: '', country: 'ALL', p: 'ALL', coop: 'ALL', contact: 'ALL', level: 'ALL' };
      const qq = el('f-q'); if (qq) qq.value = '';
      ['f-country', 'f-p', 'f-coop', 'f-contact', 'f-level'].forEach((id) => { const n = el(id); if (n) n.value = 'ALL'; });
      render();
    });
    $$('.tab').forEach((b) => b.addEventListener('click', () => {
      state.view = b.dataset.view;
      // 带 t= 记住客户类型，刷新/分享链接后不丢
      location.hash = '#t=' + PROFILE + '&v=' + state.view;
      render();
    }));
    const scrim = el('scrim');
    if (scrim) scrim.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
    render();
  }

  W.UI = {
    init, render, state, openDrawer, closeDrawer, card, kpi, pChip, levelChip, coopChip, contactChip,
    scaleCell, tierDot, prodChips, sortList, exportCSV, PROFILE, IS_R, LIST, TITLE_WORD,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ============================================================
   views_map.js — 总部地理分布（气泡 = 都市圈，底色 = 州/省客户数）
   依赖 geodata.js 提供的 project / CITY / STATE_CN / PROV_CN
   ============================================================ */
(function (W) {
  'use strict';
  const CORE = W.CORE, APP = W.APP;
  const { esc, pctf } = CORE;
  const C = CORE.C;
  const PROFILE = W.__PROFILE__ || 'retailer';
  const IS_R = PROFILE === 'retailer';

  const R_COLOR = { P1: C.p1, P2: C.p2, P3: C.p3 };
  const MERGE_R = 9;

  function hqOf(c) { return c.hq && c.hq.ok ? c.hq : null; }

  function cluster(list) {
    const pts = list.filter(hqOf).map((c) => {
      const p = W.APP.geo.project(c.hq.lat, c.hq.lon);
      return { c, x: p[0], y: p[1] };
    });
    const clusters = [];
    pts.forEach((p) => {
      let hit = null;
      for (const cl of clusters) {
        const d = Math.hypot(cl.x - p.x, cl.y - p.y);
        if (d < MERGE_R) { hit = cl; break; }
      }
      if (hit) {
        hit.items.push(p.c);
        hit.x = (hit.x * (hit.items.length - 1) + p.x) / hit.items.length;
        hit.y = (hit.y * (hit.items.length - 1) + p.y) / hit.items.length;
      } else {
        clusters.push({ x: p.x, y: p.y, items: [p.c] });
      }
    });
    // 按 P 码决定主色（取组内最高优先级）
    clusters.forEach((cl) => {
      const order = { P1: 0, P2: 1, P3: 2 };
      cl.items.sort((a, b) => (order[a.p] ?? 9) - (order[b.p] ?? 9));
      cl.top = cl.items[0];
      cl.color = R_COLOR[cl.top.p] || C.gray;
      cl.label = cl.top.hq.city || cl.top.hq.state || cl.top.name;
      cl.r = Math.min(13, 4.4 + Math.sqrt(cl.items.length) * 2.5);
    });
    return clusters;
  }

  function labelBoxes(clusters) {
    const placed = [];
    clusters.sort((a, b) => b.items.length - a.items.length).forEach((cl) => {
      const cands = [[0, -1], [1, -0.35], [1, 0.6], [-1, -0.35], [-1, 0.6], [0, 1.25], [0.9, -1.5], [-0.9, -1.5]];
      for (const [dx, dy] of cands) {
        const w = Math.max(30, cl.label.length * 6.6);
        const x = cl.x + dx * (cl.r + 4) - (dx < 0 ? w : 0);
        const y = cl.y + dy * (cl.r + 12) - 8;
        const box = { x, y, w, h: 12 };
        const clash = placed.some((b) => !(box.x + box.w < b.x || box.x > b.x + b.w || box.y + box.h < b.y || box.y > b.y + b.h))
          || clusters.some((o) => o !== cl && Math.hypot(o.x - (box.x + w / 2), o.y - (box.y + 6)) < o.r + 7);
        if (!clash) { placed.push(box); cl.lx = box.x + w / 2; cl.ly = box.y + 6; cl.anchor = 'middle'; return; }
      }
      cl.lx = cl.x; cl.ly = cl.y - cl.r - 5;
    });
  }

  function stateCounts(list) {
    const m = {};
    list.forEach((c) => { if (hqOf(c) && c.hq.state) m[c.hq.state] = (m[c.hq.state] || 0) + 1; });
    return m;
  }
  const BINS = [
    { min: 7, color: '#B42318' }, { min: 4, color: '#DC6803' },
    { min: 2, color: '#F79009' }, { min: 1, color: '#FDE68A' },
  ];
  function binColor(n) {
    if (!n) return '#F2F4F7';
    for (const b of BINS) if (n >= b.min) return b.color;
    return '#F2F4F7';
  }

  function view(list) {
    const GEO = W.APP.geo.GEO;
    const sCount = stateCounts(list);
    const cl = cluster(list);
    labelBoxes(cl);
    const located = list.filter(hqOf).length;
    const missing = list.filter((c) => !hqOf(c));

    const land = GEO.features.map((f) => {
      const n = sCount[f.n] || 0;
      return `<path class="land" d="${f.d}" fill="${binColor(n)}" data-st="${esc(f.n)}"><title>${esc(f.n)}：${n} 家</title></path>`;
    }).join('');

    const bubbles = cl.map((c) => `<g class="mdot" data-cl="${esc(c.label)}">
        <title>${esc(c.label)}：${c.items.length} 家</title>
        <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${c.r.toFixed(1)}" fill="${c.color}" fill-opacity=".92" stroke="#fff" stroke-width="1.1"/>
        ${c.items.length > 1 ? `<text x="${c.x.toFixed(1)}" y="${(c.y + 2.9).toFixed(1)}" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#fff">${c.items.length}</text>` : ''}
      </g>`).join('');

    const labels = cl.map((c) => `<text class="mlabel" x="${c.lx.toFixed(1)}" y="${c.ly.toFixed(1)}" text-anchor="${c.anchor || 'middle'}">${esc(c.label)}</text>`).join('');

    // 侧栏：州/省排行
    const ranks = Object.entries(sCount).sort((a, b) => b[1] - a[1]).slice(0, 9);
    const maxN = ranks.length ? ranks[0][1] : 1;
    const cnName = (k) => {
      const m = Object.entries(W.APP.geo.STATE_CN).find(([, v]) => v === k)
        || Object.entries(W.APP.geo.PROV_CN).find(([, v]) => v === k);
      return m ? m[0].replace(/省$|州$/, '') : k;
    };
    const rankRows = ranks.map(([k, v]) => `<div class="dens-row">
        <span class="nm" title="${esc(k)}">${esc(cnName(k))}</span>
        <span class="bar"><i style="width:${(v / maxN) * 100}%;background:${C.brand}"></i></span>
        <span class="n">${v}</span></div>`).join('');

    const cityRanks = cl.slice().sort((a, b) => b.items.length - a.items.length).slice(0, 6).map((c) => `<div class="dens-row">
        <span class="nm" title="${esc(c.label)}">${esc(c.label)}</span>
        <span class="bar"><i style="width:${(c.items.length / cl[0].items.length) * 100}%;background:${c.color}"></i></span>
        <span class="n">${c.items.length}</span></div>`).join('');

    const legendZones = [{ label: '7+ 家', color: '#B42318' }, { label: '4–6 家', color: '#DC6803' }, { label: '2–3 家', color: '#F79009' }, { label: '1 家', color: '#FDE68A' }, { label: '0', color: '#F2F4F7' }];

    return `
    <div class="map-grid">
      <div class="card map-card">
        <div class="card-h"><h3>${IS_R ? '零售商' : '代理集成商'}总部分布</h3>
          <span class="hint">气泡 = 都市圈（半径随家数）· 底色 = 州/省客户数 · 悬停看明细</span></div>
        <div style="padding:10px 12px 0">
          <svg class="map-svg" viewBox="0 0 ${GEO.w} ${GEO.h}" id="na-map">
            ${land}
            ${bubbles}
            ${labels}
          </svg>
        </div>
        <div class="map-legend">
          ${legendZones.map((l) => `<span class="lg"><span class="sw" style="background:${l.color}"></span>${l.label}</span>`).join('')}
          <span class="lg" style="margin-left:auto"><span class="dt2" style="background:${C.p1}"></span>P1</span>
          <span class="lg"><span class="dt2" style="background:${C.p2}"></span>P2</span>
          <span class="lg"><span class="dt2" style="background:${C.p3}"></span>P3</span>
        </div>
      </div>
      <div class="map-side">
        <div class="card"><div class="card-h"><h3>区域集中度</h3></div>
          <div class="card-b">${rankRows || '<div class="empty">无数据</div>'}</div></div>
        <div class="card"><div class="card-h"><h3>都市圈 Top</h3></div>
          <div class="card-b">${cityRanks || '<div class="empty">无数据</div>'}</div></div>
        <div class="card"><div class="card-h"><h3>定位覆盖</h3></div>
          <div class="card-b">
            <div class="kv"><dt>已定位</dt><dd>${located} / ${list.length}（${pctf(located, list.length)}%）</dd>
            <dt>未定位</dt><dd>${missing.length} 家${missing.length ? '：' + missing.slice(0, 4).map((c) => esc(c.name)).join('、') : ''}</dd></div>
            <div class="note" style="margin-top:8px">总部经纬度由「一句话简介」中的总部描述解析；解析不到就标「未定位」，不猜测。</div>
          </div></div>
      </div>
    </div>
    <div class="maptip" id="maptip"></div>`;
  }

  function bind(list) {
    const tip = document.getElementById('maptip');
    const map = document.getElementById('na-map');
    if (!tip || !map) return;
    const cl = cluster(list);
    cl.forEach((c) => (c.label2 = c.label));
    const byLabel = {};
    cluster(list).forEach((c) => (byLabel[c.label] = c));

    const show = (evt, html) => {
      tip.innerHTML = html;
      tip.classList.add('on');
      const x = evt.clientX + 14, y = evt.clientY + 14;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = Math.min(x, window.innerWidth - w - 10) + 'px';
      tip.style.top = Math.min(y, window.innerHeight - h - 10) + 'px';
    };
    const hide = () => tip.classList.remove('on');

    map.querySelectorAll('[data-cl]').forEach((g) => {
      g.addEventListener('mousemove', (e) => {
        const c = byLabel[g.dataset.cl];
        if (!c) return;
        const rows = c.items.slice(0, 6).map((it) => `<div class="tt-row" data-id="${it.id}"><span class="nm">${CORE.esc(it.name)}</span><span class="sc">${it.p || ''}</span></div>`).join('');
        show(e, `<div class="tt-h">${CORE.esc(c.label)}</div><div class="tt-sub">${c.items.length} 家${c.items.length > 6 ? '（前 6 家）' : ''}</div>${rows}<div class="tt-hint">点击客户名查看详情</div>`);
      });
      g.addEventListener('mouseleave', hide);
      g.addEventListener('click', (e) => {
        const row = e.target.closest('.tt-row');
        if (row && W.UI) W.UI.openDrawer(row.dataset.id);
      });
    });
    map.querySelectorAll('path.land').forEach((p) => {
      p.addEventListener('mousemove', (e) => {
        const n = p.getAttribute('data-st');
        const hits = list.filter((c) => c.hq && c.hq.ok && c.hq.state === n);
        show(e, `<div class="tt-h">${CORE.esc(n)}</div><div class="tt-sub">${hits.length} 家客户</div>`);
      });
      p.addEventListener('mouseleave', hide);
    });
    map.addEventListener('mouseleave', hide);
  }

  W.MAP_VIEW = view;
  W.MAP_BIND = bind;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ============================================================
   views_retailer.js — 零售商专有视图：竞品 SKU 结构 / OBSBOT 入驻预判 / 方法页补充
   ============================================================ */
(function (W) {
  'use strict';
  const CORE = W.CORE, APP = W.APP;
  const { esc, pctf, hbar, heatMatrix, priceLadder } = CORE;
  const C = CORE.C;
  const UI = W.UI;

  /* 品牌在多少家店在售 + 合计 SKU */
  function brandStats(list) {
    const m = {};
    list.forEach((c) => {
      c.sku.list.forEach((b) => {
        const k = b.brand.toLowerCase();
        if (!m[k]) m[k] = { brand: b.brand, stores: 0, sku: 0, los: [], his: [] };
        m[k].stores += 1;
        m[k].sku += b.sku || 0;
        if (b.lo != null) m[k].los.push(b.lo);
        if (b.hi != null) m[k].his.push(b.hi);
      });
    });
    return Object.values(m).sort((a, b) => b.stores - a.stores || b.sku - a.sku);
  }

  function viewCompetitor(list) {
    const withData = list.filter((c) => c.sku.brandCount > 0);
    const totalSku = list.reduce((a, c) => a + c.sku.totalSku, 0);
    const obsShelf = list.filter((c) => c.sku.obs && c.sku.obs.sku > 0);
    const insta = list.filter((c) => c.sku.instaSku > 0);
    const hiOpp = list.filter((c) => c.advice.level === '高');
    const noData = list.filter((c) => !c.sku.brandCount);

    const bs = brandStats(withData);
    const topBrands = bs.slice(0, 11);

    // 矩阵：SKU 最多的 18 家 × Top 品牌
    const rows = withData.slice().sort((a, b) => b.sku.totalSku - a.sku.totalSku).slice(0, 18)
      .map((c) => ({ label: c.name, c }));
    const cols = topBrands.map((b) => ({ label: b.brand, key: b.brand.toLowerCase() }));
    const cell = (r, col) => {
      const hit = r.c.sku.list.find((x) => x.brand.toLowerCase() === col.key);
      return hit ? { sku: hit.sku, lo: hit.lo, hi: hit.hi, isObs: /obsbot/i.test(hit.brand) } : null;
    };

    // 产品建议频次
    const freq = {};
    list.forEach((c) => (c.advice.items || []).forEach((i) => { freq[i.key] = (freq[i.key] || 0) + 1; }));
    const freqItems = APP.PRODUCTS.map((p) => ({
      label: `${p.key}  $${p.lo}–${p.hi}`, value: freq[p.key] || 0,
      color: freq[p.key] >= 20 ? C.brand : C.brand3, text: (freq[p.key] || 0) + ' 家',
    })).sort((a, b) => b.value - a.value);

    // 机会清单
    const opp = list.slice().sort((a, b) => {
      const o = { 高: 0, 中: 1, 低: 2, 维持: 3, 未知: 4 };
      return (o[a.advice.level] - o[b.advice.level]) || ((b.advice.items[0] || {}).w || 0) - ((a.advice.items[0] || {}).w || 0);
    });
    const oppRows = opp.filter((c) => c.advice.level !== '未知').map((c) => `<tr data-id="${c.id}">
        <td>${UI.pChip(c)}</td>
        <td><div class="tname">${esc(c.name)}</div><div class="mini">${esc(c.name ? (c.intro || '').slice(0, 30) : '')}</div></td>
        <td class="num">${c.sku.totalSku || '—'}</td>
        <td>${c.sku.hasInsta ? `<span class="chip violet">Insta360 ${c.sku.instaSku}</span>` : '<span class="mini muted">—</span>'}</td>
        <td>${c.sku.obs && c.sku.obs.sku ? `<span class="chip blue">${c.sku.obs.sku} SKU</span>` : '<span class="chip na">未在架</span>'}</td>
        <td>${UI.levelChip(c.advice.level)}</td>
        <td>${UI.prodChips(c.advice.items, 3)}</td>
        <td class="mini" style="white-space:normal;line-height:1.45;max-width:330px">${esc((c.advice.items[0] || {}).why || c.advice.headline)}</td>
      </tr>`).join('');

    // 空白价格带汇总
    const gapCount = {};
    list.forEach((c) => (c.advice.gaps || []).forEach((g) => { gapCount[g.band.key] = (gapCount[g.band.key] || 0) + 1; }));

    return `
    <div class="grid g-kpi" style="margin-bottom:14px">
      ${kpi2('有竞品结构', withData.length + '<small>/' + list.length + '</small>', '其余原表只写「/」')}
      ${kpi2('竞品 SKU 总量', totalSku.toLocaleString(), `${bs.length} 个品牌`)}
      ${kpi2('OBSBOT 在架', obsShelf.length, `占 ${pctf(obsShelf.length, list.length)}%`, obsShelf.length ? 'accent' : '')}
      ${kpi2('Insta360 在架', insta.length, 'AI 云台追踪已验证')}
      ${kpi2('高机会门店', hiOpp.length, '可直接谈上架', hiOpp.length ? 'accent' : '')}
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-h"><h3>竞品 SKU 结构矩阵</h3>
        <span class="hint">行 = SKU 深度 Top 18 门店 · 列 = 覆盖最广的 11 个品牌 · 数字为 SKU 数 · 蓝色列 = OBSBOT</span></div>
      <div class="card-b" style="padding-top:6px;overflow-x:auto">
        ${rows.length ? heatMatrix(rows, cols, cell, { cw: 44, rowH: 24 }) : '<div class="empty">无可解析的竞品 SKU 数据</div>'}
        <div class="mini muted" style="margin-top:8px">颜色越深 = 该品牌在该店 SKU 越多（对数标度）。空白 = 该店无此品牌记录。</div>
      </div></div>

    <div class="grid g-2" style="margin-bottom:14px">
      ${UI.card('各产品被建议的次数', '按门店数计', hbar(freqItems, { max: Math.max(1, ...freqItems.map((f) => f.value)), padL: 132, padR: 70, rowH: 30 }))}
      ${UI.card('品牌渠道覆盖度', '在多少家门店在售 × SKU 合计', hbar(topBrands.slice(0, 8).map((b) => ({

    const tone = c.role.bin === '分销商' ? '#0E7490' : '#3B6FD4';
    const label = ROLE_MINI[c.role.sub] || c.role.sub;
    return `<span style="color:${tone}" title="渠道角色（依据简介原句）：${esc(c.role.why)}">${esc(label)}</span>`;
  }

  /* 客户名单元格：名字 +「打开官网」小图标，第二行仍是 渠道角色 · 国家 · 主推。
     图标是 <a>，bindView 的行点击会跳过 a → 点图标直接开新标签去官网，
     点名字/其它空白处开右侧抽屉（抽屉头部有完整的「打开官网」按钮）。 */
  function nameCell(c) {
    const site = siteUrl(c.url), host = siteHost(c.url);
    const adv = c.advice && c.advice.items && c.advice.items.length ? ' · 主推 ' + c.advice.items.map((i) => i.key).join('/') : '';
    const link = site
      ? `<a class="sitego" href="${esc(site)}" target="_blank" rel="noopener noreferrer" title="在新标签页打开官网：${esc(site)}" aria-label="打开官网">↗</a>`
      : '';
    const lead = c.batch === 'new'
      ? '<span class="chip lead" title="新增客户：只有国家 / 客户名 / 优先级 / 简介 / 官网，体量与竞品待补研">新增</span>'
      : '';
    const tail = host ? `<span class="mini" style="opacity:.75"> · ${esc(host)}</span>` : '';
    return `<div class="tname">${esc(c.name)}${lead}${link}</div>
      <div class="mini">${roleMini(c)} · ${countryLabel(c)}${adv}${tail}</div>`;
  }

  /* ---------- 视图 ---------- */
  /* 范围：全部 / 只看新增名单 / 只看原表客户。
     新增的 600+ 家没有体量，按 P 码 → 体量排序永远沉在列表底部，不切一下就翻不到。 */
  let SCOPE = 'all';

  function viewPipe(list) {
    const scopeAll = list;
    const nNew = scopeAll.filter((c) => c.batch === 'new').length;
    const nBase = scopeAll.length - nNew;
    if (SCOPE === 'new') list = scopeAll.filter((c) => c.batch === 'new');
    else if (SCOPE === 'base') list = scopeAll.filter((c) => c.batch !== 'new');

    const t0 = today(), t7 = addDays(7);
    const filled = list.filter(touched);
    const owned = list.filter((c) => ownerOf(c));
    const overdue = list.filter((c) => { const r = rec(c); return r.planDate && r.planDate < t0 && CLOSED.indexOf(r.stage) < 0; });
    const week = list.filter((c) => { const r = rec(c); return r.planDate && r.planDate >= t0 && r.planDate <= t7; });
    const closed = list.filter((c) => CLOSED.indexOf(rec(c).stage) >= 0);
    const noPlan = filled.filter((c) => !rec(c).planDate && CLOSED.indexOf(rec(c).stage) < 0);

    const stageCount = STAGES.map((s) => ({ label: s, value: list.filter((c) => rec(c).stage === s).length }));
    const blank = list.filter((c) => !rec(c).stage).length;
    const stageItems = stageCount.filter((x) => x.value).map((x) => ({ label: x.label, value: x.value, color: STAGE_COLOR[x.label] }));
    if (blank) stageItems.push({ label: '未填写阶段', value: blank, color: '#E5E9F0' });

    const ownerMap = {};
    owned.forEach((c) => { const o = ownerOf(c); ownerMap[o] = (ownerMap[o] || 0) + 1; });
    const ownerItems = Object.keys(ownerMap).sort((a, b) => ownerMap[b] - ownerMap[a]).slice(0, 10)
      .map((k) => ({ label: k, value: ownerMap[k], color: C.brand, text: ownerMap[k] + ' 家' }));

    const rows = UI.sortList(list).map((c) => {
      const r = rec(c);
      const late = r.planDate && r.planDate < t0 && CLOSED.indexOf(r.stage) < 0;
      const opt = (arr, cur) => ['<option value="">未填写</option>'].concat(arr.map((s) => `<option value="${esc(s)}"${cur === s ? ' selected' : ''}>${esc(s)}</option>`)).join('');
      return `<tr data-id="${c.id}" class="${late ? 'late' : ''}"${r.by ? ` title="最近更新：${esc(r.by)}${r.updated ? ' · ' + esc(r.updated) : ''}"` : ''}>
        <td>${nameCell(c)}</td>
        <td>${UI.pChip(c, false)}</td>
        <td>${c.mny ? moneyRangeShort(c.mny.low, c.mny.high) : '<span class="mini muted">未量化</span>'}</td>
        <td><select class="pin" data-id="${c.id}" data-f="stage">${opt(STAGES, r.stage || '')}</select></td>
        <td><input class="pin" data-id="${c.id}" data-f="done" value="${esc(r.done || '')}" placeholder="已完成什么" title="已完成动作：这一轮实际做掉的事，便于交接与复盘"></td>
        <td><input class="pin" data-id="${c.id}" data-f="next" value="${esc(r.next || '')}" placeholder="下一步做什么"></td>
        <td><input class="pin" data-id="${c.id}" data-f="owner" value="${esc(ownerOf(c))}" placeholder="待指派" style="min-width:74px"${!r.owner && c.ownerDefault ? ' title="默认负责人：' + esc(c.ownerDefault) + '（改动即覆盖）"' : ''}></td>
        <td><input class="pin" type="date" data-id="${c.id}" data-f="planDate" value="${esc(r.planDate || '')}">
          ${late ? '<div class="mini" style="color:#B54708">逾期</div>' : ''}</td>
        <td><input class="pin" type="date" data-id="${c.id}" data-f="lastDate" value="${esc(r.lastDate || '')}"></td>
        <td><input class="pin" data-id="${c.id}" data-f="difficulty" value="${esc(r.difficulty || '')}" placeholder="卡在哪"></td>
        <td><input class="pin" data-id="${c.id}" data-f="direction" value="${esc(r.direction || '')}" placeholder="想谈成什么"></td>
        <td><select class="pin" data-id="${c.id}" data-f="verify">${opt(VERIFY, r.verify || '')}</select></td>
      </tr>`;
    }).join('');

    const scopeBtn = (k, label, n) => `<button data-pipe-scope="${k}" class="${SCOPE === k ? 'on' : ''}">${label}<span class="n">${n}</span></button>`;

    return `
    <div class="grid g-kpi" style="margin-bottom:14px">
      ${UI.kpi('在管客户', list.length, SCOPE === 'all' ? '当前类型的全部客户' : (SCOPE === 'new' ? '当前只看新增名单' : '当前只看原表客户'), 'accent')}
      ${UI.kpi('已指派负责人', owned.length, `覆盖率 ${pctf(owned.length, list.length)}%`)}
      ${UI.kpi('本周待跟进', week.length, `${t0} ~ ${t7}`, week.length ? 'alert' : '')}
      ${UI.kpi('逾期未跟进', overdue.length, overdue.length ? '计划日期已过，优先处理' : '暂无逾期', overdue.length ? 'alert' : '')}
      ${UI.kpi('已上架 / 维护中', closed.length, closed.length ? '进入增量经营阶段' : '尚未推进到此阶段')}
      ${UI.kpi('有进展无下一步', noPlan.length, noPlan.length ? '缺计划日期，容易断档' : '计划日期都齐')}
    </div>

    <div class="grid g-2" style="margin-bottom:14px">
      ${UI.card('开发阶段分布', '按当前记录统计 · 未填写单独列出',
        filled.length
          ? donutStages(stageItems)
          : '<div class="empty" style="padding:44px 16px">还没有任何跟进记录<br><span class="mini muted">在下方表格里选一个「当前阶段」即可开始</span></div>')}
      ${UI.card('负责人负载', '按已指派的客户数', ownerItems.length ? hbar(ownerItems, { height: 200 }) : '<div class="empty" style="padding:44px 16px">还没有指派负责人<br><span class="mini muted">填上「负责人」后这里会显示各自在管多少家</span></div>')}
    </div>

    <div class="card">
      <div class="card-h"><h3>客户开发与跟进记录</h3>
        <span class="hint">直接在格子里填 · ${cloudOn() ? '改动实时同步给所有打开链接的人' : '自动保存在本机浏览器'} · 点表头可排序</span>
        <div class="right">
          <div class="scope">${scopeBtn('all', '全部', scopeAll.length)}${scopeBtn('new', '新增名单', nNew)}${scopeBtn('base', '原表客户', nBase)}</div>
          ${whoBox()}${syncBadge()}
          <button class="btn sm" data-pipe-act="init">按原表预填阶段</button>
          <button class="btn sm" data-pipe-act="import">导入 CSV</button>
          <button class="btn sm" data-pipe-act="export">导出 CSV</button>
          <button class="btn ghost sm" data-pipe-act="clear">清空记录</button>
        </div></div>
      <div class="card-b" style="padding-top:8px">
        <div class="tablewrap" style="max-height:calc(100vh - 330px)"><table class="dt pipe">
          <thead><tr>
            <th style="min-width:190px">客户</th><th>P</th><th class="num">综合体量</th>
            <th style="min-width:104px">当前阶段</th>
            <th style="min-width:150px">已完成动作</th><th style="min-width:150px">下一步行动</th>
            <th style="min-width:84px">负责人</th><th style="min-width:120px">计划跟进</th><th style="min-width:120px">最近跟进</th>
            <th style="min-width:120px">开发难点</th><th style="min-width:120px">预期合作方向</th><th style="min-width:92px">数据核实</th>
          </tr></thead>
          <tbody>${rows}</tbody></table></div>
        ${persisted() ? '' : '<div class="note warn" style="margin-top:10px">当前浏览器禁用了本地存储，填写内容只在本次会话有效，请及时导出 CSV。</div>'}
        <div class="note" style="margin-top:10px">
          <b>怎么用</b>：阶段与负责人按实际情况填，空着就显示「未填写」，看板不会替你猜；
          <b>「按原表预填阶段」</b>只会把空记录按「是否在合作 / 是否建联」映射一个起点（已合作→已合作·维护中、已建联→已建联、其余→未接触），<b>不覆盖你已填的任何内容</b>；
          ${cloudOn()
            ? '记录保存在共享云端表里，<b>任何人都能看到别人填的最新内容</b>，每 6 秒自动拉取一次，切回这个标签页时立即刷新；'
              + '按字段保存，两个人同时改同一家的不同列不会互相覆盖（改同一列以最后一次提交为准）。'
              + '<b>建议先在右上角填上「填写人」</b>，方便区分是谁改的。把网址发给同事即可共同维护。'
            : `数据只存在这台电脑的浏览器里（localStorage），<b>不会写回 Excel</b>，需要交给别人就「导出 CSV」。`
              + (W.__CLOUD__ && W.__CLOUD__.site
                ? `<br><b>要多人同时填、互相看得到</b> → 用共享网址打开：<a href="${esc(W.__CLOUD__.site)}" target="_blank" rel="noopener">${esc(W.__CLOUD__.site)}</a>`
                  + (W.SYNC.reason && W.SYNC.reason() === 'origin'
                    ? '（当前这个网址不在云端登记的域名内，所以只能本机记；共享版是同一个看板，区别只是域名对得上云端）'
                    : '（双击本地 HTML 属于离线条目，不联网）')
                : '')}
        </div>
      </div></div>`;
  }

  function donutStages(items) {
    return CORE.donut(items, { centerLabel: '客户数', size: 180 });
  }
  function persisted() { return okStore; }

  /* ---------- 云端共享（接入 sync.js） ---------- */
  const BACK = {
    stage: 'stage', next_action: 'next', done_action: 'done', owner: 'owner', plan_date: 'planDate',
    last_date: 'lastDate', difficulty: 'difficulty', direction: 'direction', verify: 'verify',
  };
  let rerenderRef = null;
  let firstPull = true;
  let unsub = null;

  /* ---------- 重绘时保住滚动位置 ----------
     跟进页的表格自己带滚动条（.tablewrap），而 render() 会整块重建 #view-pipe。
     只要重绘就回到顶部，等于填完一格就被弹走 —— 这里在重绘前后各截一次位置。 */
  let keepTop = 0, keepLeft = 0, keepWinY = 0;
  function snapshotScroll() {
    const tw = document.querySelector('#view-pipe .tablewrap');
    if (tw) { keepTop = tw.scrollTop; keepLeft = tw.scrollLeft; }
    keepWinY = window.pageYOffset || document.documentElement.scrollTop || 0;
  }
  function restoreScroll() {
    const tw = document.querySelector('#view-pipe .tablewrap');
    if (tw) { tw.scrollTop = keepTop; tw.scrollLeft = keepLeft; }
    if (keepWinY) window.scrollTo(window.pageXOffset || 0, keepWinY);
  }
  function rerenderKeepScroll() {
    if (!rerenderRef) return;
    snapshotScroll();
    rerenderRef();
    restoreScroll();
    // 图表/SVG 在首帧后才定高，再补一次，避免位置被"回弹"
    requestAnimationFrame(restoreScroll);
  }

  function cloudOn() { return !!(W.SYNC && W.SYNC.enabled); }

  function badgeInner() {
    if (!cloudOn()) {
      const reason = W.SYNC.reason ? W.SYNC.reason() : '';
      const site = W.SYNC.site ? W.SYNC.site() : '';
      if (reason === 'origin') {
        return site
          ? `<a class="chip mid" href="${esc(site)}" target="_blank" rel="noopener"
            title="云端只接受登记过的域名，这个网址不在名单内；点此打开共享版">此网址不同步 · 去共享版</a>`
          : '<span class="chip mid" title="云端只接受登记过的域名">此网址不同步</span>';
      }
      return '<span class="chip na" title="本机记录：换浏览器或别人打开都看不到">本机记录</span>';
    }
    const st = W.SYNC.status();
    const at = W.SYNC.lastAt();
    const hhmm = at ? String(at.getHours()).padStart(2, '0') + ':' + String(at.getMinutes()).padStart(2, '0') : '';
    if (st === 'online') {
      return '<span class="chip ok">云端已同步</span>'
        + (hhmm ? `<span class="sync-at mini muted" style="margin:0 6px 0 4px">${hhmm}</span>` : '');
    }
    if (st === 'connecting') return '<span class="chip mid" style="margin-right:6px">正在连接云端…</span>';
    return `<span class="chip mid" style="margin-right:6px" title="${esc(W.SYNC.lastErr() || '')}">云端未连接 · 已存本机</span>`;
  }
  function syncBadge() {
    return `<span class="syncz" style="display:inline-flex;align-items:center">${badgeInner()}</span>`;
  }

  function whoBox() {
    if (!cloudOn()) return '';
    return `<label class="mini muted" style="display:inline-flex;align-items:center;gap:4px;margin-right:8px">填写人
      <input id="pipe-who" value="${esc(W.SYNC.who() || '')}" placeholder="你的名字"
        style="width:86px;height:24px;padding:0 6px;border:1px solid #DDE3EC;border-radius:6px;background:#fff;font-size:12px;color:var(--ink)"></label>`;
  }

  /* 把云端行合并进本地缓存。
     规则：服务器行是「已确认的事实」，除了本机仍标记为待同步(_pend)的字段外，
     一律以服务器为准 —— 因此任何一台机器时钟不准都不会导致收不到别人的更新。 */
  function sameRec(a, b) {
    const ka = Object.keys(a).filter((k) => k !== '_ts').sort();
    const kb = Object.keys(b).filter((k) => k !== '_ts').sort();
    if (ka.join() !== kb.join()) return false;
    return ka.every((k) => {
      const x = a[k], y = b[k];
      if (k === '_pend') return JSON.stringify(x) === JSON.stringify(y);
      return String(x) === String(y);
    });
  }

  function applyRemote(rows) {
    let changed = false;
    const remoteIds = {};
    (rows || []).forEach((r) => {
      if (!r || !r.id) return;
      remoteIds[r.id] = true;
      const local = DB[r.id] || {};
      const pend = local._pend || {};
      const nr = {};
      if (local.updated) nr.updated = local.updated;
      if (local.by) nr.by = local.by;

      Object.keys(BACK).forEach((col) => {
        const lk = BACK[col];
        if (pend[lk]) {                       // 本机改动还没确认落库 → 保留本机值
          if (local[lk] != null) nr[lk] = local[lk];
          return;
        }
        const v = r[col];
        if (v) nr[lk] = v;
      });

      if (Object.keys(pend).length) nr._pend = pend;
      if (r.updated_at) {
        nr._ts = Date.parse(r.updated_at) || 0;
        nr.updated = String(r.updated_at).slice(0, 10);
      }
      if (r.updated_by) nr.by = r.updated_by;

      // 云端行完全没有内容且本机也没有待同步字段 → 清掉空壳
      const hasData = ['stage', 'next', 'done', 'owner', 'planDate', 'lastDate', 'difficulty', 'direction', 'verify']
        .some((k) => nr[k]);

      if (!hasData && !Object.keys(pend).length) {
        if (DB[r.id]) { delete DB[r.id]; changed = true; }
        return;
      }
      if (!sameRec(local, nr)) { DB[r.id] = nr; changed = true; }
    });

    if (firstPull) {
      firstPull = false;
      const cmap = {};
      (W.APP.customers || []).forEach((c) => (cmap[ck(c)] = c));
      Object.keys(DB).slice().forEach((id) => {
        const r = DB[id] || {};
        const c = cmap[id];
        if (!c) return;
        // 上次没写成功的字段（含整个客户只在本地存在的情况）在这里补推
        Object.keys(BACK).forEach((col) => {
          const lk = BACK[col];
          if (r[lk] && (r._pend && r._pend[lk] || !remoteIds[id])) W.SYNC.push(c, lk, r[lk]);
        });
      });
    }

    save();
    if (changed && rerenderRef) {
      const el = document.activeElement;
      const editing = el && el.closest && el.closest('#view-pipe');
      const onPipe = !!document.querySelector('#view-pipe table.pipe');
      if (onPipe && !editing) rerenderKeepScroll();
    }
  }

  /* ---------- 交互 ---------- */
  function bindView(box, rerender) {
    rerenderRef = rerender;

    // 填写人 + 云端状态：状态变化时只更新角标，不整页重绘（避免打断输入）
    const who = box.querySelector('#pipe-who');
    if (who) {
      ['click', 'mousedown', 'focus'].forEach((ev) => who.addEventListener(ev, (e) => e.stopPropagation()));
      who.addEventListener('change', () => {
        W.SYNC.setWho(who.value.trim());
        if (W.__toast) W.__toast(who.value.trim() ? '已记下填写人：' + who.value.trim() : '已清除填写人');
      });
    }
    if (cloudOn() && !unsub) {
      unsub = W.SYNC.subscribe(() => {
        const holder = document.querySelector('#view-pipe .syncz');
        if (holder) holder.innerHTML = badgeInner();
      });
    }

    // 输入：失焦即存；阶段类改动重绘（影响分布图）
    $$('.pin', box).forEach((n) => {
      if (n.id === 'pipe-who') return;
      // 阻止冒泡：否则点击单元格会触发 tr 的行点击，把客户详情抽屉弹出来
      ['click', 'mousedown', 'focus'].forEach((ev) => n.addEventListener(ev, (e) => e.stopPropagation()));
      n.addEventListener('change', () => {
        const c = findById(n.dataset.id);
        if (!c) return;
        put(c, n.dataset.f, n.value.trim());
        if (n.dataset.f === 'stage' || n.tagName === 'SELECT') rerenderKeepScroll();
        else if (W.__toast) W.__toast(cloudOn() ? '已保存并同步' : '已保存');
      });
    });
    $$('[data-pipe-scope]', box).forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation();
      if (SCOPE === b.dataset.pipeScope) return;
      SCOPE = b.dataset.pipeScope;
      rerenderKeepScroll();
    }));
    const act = (name, fn) => {
      const b = box.querySelector('[data-pipe-act="' + name + '"]');
      if (b) b.addEventListener('click', fn);
    };
    act('init', () => { prefill(); rerender(); if (W.__toast) W.__toast('已按原表状态预填空白记录'); });
    act('export', () => exportCSV());
    act('import', () => importCSV(rerender));
    act('clear', () => {
      if (!confirm(cloudOn()
        ? '这只是清空这台电脑上的缓存，云端共享记录不会被删除，下一次拉取会重新补回来。确定继续？'
        : '确定清空全部跟进记录？此操作不可撤销（建议先导出 CSV 备份）。')) return;
      DB = {}; save(); rerender();
      if (cloudOn() && W.SYNC.pull) W.SYNC.pull();
    });
  }

  function findById(id) {
    return (W.APP.customers || []).filter((c) => c.id === id)[0];
  }

  function prefill() {
    (W.UI.LIST() || []).forEach((c) => {
      if (rec(c).stage) return;                       // 已有记录不动
      if (touched(c) && !rec(c).stage) return;        // 填过别的字段也不动
      let s = '未接触';
      if (c.coop === '已合作') s = '已合作·维护中';
      else if (c.contact === '是') s = '已建联';
      put(c, 'stage', s);
    });
  }

  /* ---------- CSV ---------- */
  const HEAD = ['类型', '数据批次', '渠道角色', '细分角色', '客户名', '优先级', '国家', '综合体量下限USD', '综合体量上限USD', '当前阶段', '已完成动作', '下一步行动', '负责人', '计划跟进', '最近跟进', '开发难点', '预期合作方向', '数据核实', '最近更新'];
  function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }

  function exportCSV() {
    const list = UI.sortList(W.UI.LIST());

<script>/* ============================================================
   sync.js — 跟进记录的云端共享同步
   依赖：
     window.WorkBuddyCloud   —— 构建时内联（src/vendor/cloud-sdk.js），零外链
     window.__CLOUD__        —— 构建时注入 endpoint / publishableKey
   行为：
     - 打开页面拉取全量记录 → 合并进本地缓存（逐个字段按时间取新）
     - 每 6 秒轮询一次；切回标签页时立即拉取
     - 本地改动 → 单字段 upsert 写回，两个人改不同列不会互相覆盖
     - file:// 双击打开时不做任何网络请求，自动降级为「本机记录」
   ============================================================ */
(function (W) {
  'use strict';

  const CFG = W.__CLOUD__ || {};
  const PROTO = (typeof location !== 'undefined' && location.protocol) || '';
  const HREF = (typeof location !== 'undefined' && location.href) || '';
  const ORIGIN = (typeof location !== 'undefined' && location.origin) || 'null';
  // srcdoc 内嵌（Streamlit components.html）会继承父页面来源
  const SRCDOC = PROTO === 'about:' && /srcdoc/i.test(HREF);

  function epOrigin() {
    try { return new URL(CFG.endpoint).origin; } catch (e) { return ''; }
  }
  const EP = epOrigin();
  const LOCAL_DEV = /^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$/.test(ORIGIN);

  /* 云端服务做「精确来源匹配」：来自未登记域名的请求会被直接 403，
     而浏览器读不到那个响应体，只会表现为「连不上」。所以这里先本地判定，
     把「网址不对」和「网络不通」区分开，别让人对着一个永远连不上的地址排查。 */
  const REASON = !CFG.endpoint || !CFG.publishableKey ? 'noconfig'
    : (PROTO === 'file:' || (PROTO === 'about:' && !SRCDOC)) ? 'file'
      : (ORIGIN === EP || LOCAL_DEV) ? ''
        : 'origin';
  const OFF = !!REASON;
  const SITE = CFG.site || '';

  const TABLE = 'pipe_records';
  const SDK_CDN = 'https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js';

  function readWho() {
    try { return localStorage.getItem('obsbot.who') || ''; } catch (e) { return ''; }
  }

  /* ---------------- 本机降级模式 ---------------- */
  if (OFF) {
    W.SYNC = {
      who: readWho,
      setWho(n) { try { localStorage.setItem('obsbot.who', n || ''); } catch (e) {} },
      push() {}, pull() {}, flush() {},
      status: () => 'local',
      reason: () => REASON,
      site: () => SITE,
      lastErr: () => (REASON === 'origin' ? 'the request origin is not allowed for this client' : ''),
      lastAt: () => null,
      pending: () => 0,
      subscribe(fn) { try { fn('local', '', null); } catch (e) {} },
      enabled: false,
    };
    return;
  }

  /* ---------------- 本地字段 → 数据库列 ---------------- */
  const COLS = {
    stage: 'stage',
    next: 'next_action',
    done: 'done_action',
    owner: 'owner',
    planDate: 'plan_date',
    lastDate: 'last_date',
    difficulty: 'difficulty',
    direction: 'direction',
    verify: 'verify',
  };
  const BACK = {};
  Object.keys(COLS).forEach((k) => (BACK[COLS[k]] = k));

  let cloud = null;
  let ready = false;
  let status = 'connecting';        // connecting | online | offline
  let lastErr = '';
  let lastAt = null;
  let timer = null;
  let pulling = false;
  const subs = [];
  const queue = [];

  function emit() {
    subs.forEach((fn) => { try { fn(status, lastErr, lastAt); } catch (e) {} });
  }
  function setStatus(s, err) {
    const changed = s !== status;
    status = s;
    lastErr = err || '';
    if (changed || err) emit();
  }

  /* ---------------- SDK ---------------- */
  function loadSdk() {
    return new Promise((res, rej) => {
      if (W.WorkBuddyCloud) return res();
      // 兜底：内联版缺失时才走 CDN（正常构建不会走到这里）
      const s = document.createElement('script');
      s.src = SDK_CDN;
      s.async = true;
      s.onload = () => res();
      s.onerror = () => rej(new Error('同步组件加载失败'));
      document.head.appendChild(s);
    });
  }

  async function boot() {
    try {
      await loadSdk();
      cloud = W.WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: CFG.endpoint,
        publishableKey: CFG.publishableKey,
      });
      ready = true;
      await pull();
      timer = setInterval(pull, CFG.pollMs || 6000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
    } catch (e) {
      setStatus('offline', (e && e.message) || String(e));
    }
  }

  /* ---------------- 拉取 ---------------- */
  async function pull() {
    if (!ready || pulling) return;
    pulling = true;
    try {
      const { data, error } = await cloud.database.from(TABLE).select('*');
      if (error) throw error;
      lastAt = new Date();
      setStatus('online');
      if (W.PIPE && W.PIPE.applyRemote) W.PIPE.applyRemote(data || []);
      flush();
    } catch (e) {
      setStatus('offline', (e && (e.message || e.code)) || '拉取失败');
    } finally {
      pulling = false;
    }
  }

  /* ---------------- 写回（单字段 upsert） ---------------- */
  function markOk(id, field) {
    if (W.PIPE && W.PIPE.markSynced) W.PIPE.markSynced(id, field);
  }

  async function once(row, col) {
    const r = await cloud.database.from(TABLE).upsert(row, { onConflict: 'id' });
    if (r.error) throw r.error;
    return true;
  }

  async function push(c, field, value) {
    if (!ready || !cloud) return;
    const col = COLS[field];
    if (!col || !W.PIPE || !W.PIPE.ck) return;

    const id = W.PIPE.ck(c);
    const row = { id, ctype: c.type, customer: c.name, updated_at: new Date().toISOString() };
    row[col] = value === '' || value == null ? null : value;
    const me = readWho();
    if (me) row.updated_by = me;

    // 首次失败大概率是并发建行的瞬时冲突，短退避重试两次再入队
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        await once(row, col);
        markOk(id, field);
        setStatus('online');
        return;
      } catch (e) {
        var last = e;
        if (attempt < 2) await new Promise((r) => setTimeout(r, 350 * (attempt + 1) * (attempt + 1)));
      }
    }

    setStatus('offline', (last && (last.message || last.code)) || '保存失败');
    if (W.__toast) W.__toast('云端保存失败，已存在本机，联网后自动重试');
    if (!queue.some((q) => q.id === id && q.col === col)) queue.push({ id, field, col, row });
    scheduleFlush();
  }

  let retryTimer = null;
  function scheduleFlush() {
    if (retryTimer || !queue.length) return;
    retryTimer = setTimeout(async () => {
      retryTimer = null;
      await flush();
      if (queue.length) scheduleFlush();
    }, 2500);
  }

  async function flush() {
    if (!ready || !cloud || !queue.length) return;
    const items = queue.splice(0, queue.length);
    for (const it of items) {
      try {
        await once(it.row, it.col);
        markOk(it.id, it.field);
        setStatus('online');
      } catch (e) {
        queue.push(it);
        setStatus('offline', (e && (e.message || e.code)) || '重试失败');
        scheduleFlush();
        return;
      }
    }
  }

  W.SYNC = {
    who: readWho,
    setWho(name) { try { localStorage.setItem('obsbot.who', name || ''); } catch (e) {} },
    push,
    pull,
    flush,
    status: () => status,
    reason: () => '',
    site: () => SITE,
    lastErr: () => lastErr,
    lastAt: () => lastAt,
    pending: () => queue.length,
    subscribe(fn) { subs.push(fn); try { fn(status, lastErr, lastAt); } catch (e) {} },
    enabled: true,
  };

  // 还有没写成功的改动就关页面 → 提醒一下，避免误以为已同步
  window.addEventListener('beforeunload', (e) => {
    if (!queue.length) return;
    e.preventDefault();
    e.returnValue = '';
  });

  boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  APP.build();
  if (APP.geo) APP.geo.attachHQ();
  var pill = document.getElementById('pill-count');
  if (pill) pill.textContent = APP.meta.retailerN + ' 家零售商 · ' + APP.meta.agentN + ' 家代理集成商';
  UI.init();
  var t = document.getElementById('toast');
  window.__toast = function (m) { if (!t) return; t.textContent = m; t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 1800); };
})();
